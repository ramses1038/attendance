<style>
/* 레이아웃: 한 줄 세로 기둥(최대 720px) — 위 고정 머리줄, 학생 칸 격자, 아래 고정 저장 막대 */
:root {
  --bg: #F2F4F7;
  --surface: #FFFFFF;
  --ink: #18263A;
  --muted: #5D6B7E;
  --line: #D9DFE7;
  --accent: #2C5A8C;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3ECF6;
  --absent: #C2412F;
  --absent-bg: #FBE6E2;
  --absent-ink: #8E2A1D;
  --off-bg: #F1EADC;
  --off-ink: #74521A;
  --shadow: 0 1px 2px rgba(24,38,58,.06), 0 4px 14px rgba(24,38,58,.06);
  --display: "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "IBM Plex Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --r: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1620; --surface: #18222F; --ink: #E6EBF2; --muted: #93A1B3; --line: #2A3646;
    --accent: #84B2E3; --accent-ink: #0F1620; --accent-soft: #1F3246;
    --absent: #FF8C7C; --absent-bg: #3B2020; --absent-ink: #FFC4BA; --off-bg: #362D1E; --off-ink: #EBCB8C;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1620; --surface: #18222F; --ink: #E6EBF2; --muted: #93A1B3; --line: #2A3646;
  --accent: #84B2E3; --accent-ink: #0F1620; --accent-soft: #1F3246;
  --absent: #FF8C7C; --absent-bg: #3B2020; --absent-ink: #FFC4BA; --off-bg: #362D1E; --off-ink: #EBCB8C;
  --shadow: 0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.55 var(--body);
  -webkit-tap-highlight-color: transparent;
  word-break: keep-all;
  min-height: 100dvh;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.wrap {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* 머리줄 */
.bar {
  position: sticky; top: 0; z-index: 5;
  background: var(--bg);

main.wrap { padding-block: 16px 140px; display: flex; flex-direction: column; gap: 16px; }

/* 버튼 */

/* 반 목록 */

.help { color: var(--muted); font-size: 13px; }

}

.off-tile { background: var(--off-bg); border-color: transparent; color: var(--off-ink); cursor: default; }
.mark.offm { color: var(--off-ink); }
.who-list { display: flex; flex-wrap: wrap; gap: 6px; }
.who-list span { border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 15px; font-weight: 600; background: var(--bg); }
.who-list span small { color: var(--muted); font-weight: 500; margin-right: 4px; font-variant-numeric: tabular-nums; }
.who-list span em { font-style: normal; color: var(--off-ink); font-size: 13px; margin-left: 4px; }

/* 학생 칸 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.tile {
  position: relative; border: 1px solid var(--line); background: var(--surface);

.tile.absent { background: var(--absent-bg); border-color: var(--absent); color: var(--absent-ink); }

/* 메모 */
.memo-field { display: flex; flex-direction: column; gap: 6px; }
.memo-field textarea {
  border: 1px solid var(--line); background: var(--surface); border-radius: 12px;

/* 아래 고정 막대 */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;

  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* 기록 목록 */
.records { display: flex; flex-direction: column; gap: 8px; }
.rec { text-align: left; color: var(--ink); width: 100%; }
.label.month { margin-top: 6px; }
.rec .chev { grid-row: 1 / span 2; grid-column: 2; color: var(--muted); display: flex; align-items: center; }
.day-nav { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 8px; }
.day-nav .day-now { grid-column: 1 / -1; order: -1; }
.day-nav .btn { min-height: 44px; padding: 0 8px; font-size: 13px; font-weight: 500; gap: 2px; font-variant-numeric: tabular-nums; }
.day-nav .btn svg { width: 18px; height: 18px; flex: none; }
.day-nav .btn:last-child { justify-content: flex-end; }
.day-now { font: 22px/1.2 var(--display); text-align: center; white-space: nowrap; }
.tile.view { cursor: default; }
.rec {
  border: 1px solid var(--line); background: var(--surface); border-radius: var(--r);
  padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px;
}
.rec .when { font-weight: 600; font-variant-numeric: tabular-nums; }
.rec .abs { font-size: 14px; color: var(--muted); }
.rec .abs b { color: var(--absent-ink); font-weight: 600; }
.rec .memo { grid-column: 1 / -1; font-size: 14px; white-space: pre-wrap; }
.rec .acts { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 4px; }
.rec .acts .btn { min-height: 40px; padding: 0 12px; font-size: 14px; }

/* 시트(모달) */
.scrim {
  position: fixed; inset: 0; z-index: 20; background: rgba(10,16,24,.45);
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet {

  border-radius: 20px 20px 0 0; padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
@media (min-width: 640px) { .scrim { align-items: center; } .sheet { border-radius: 20px; } }
.sheet h2 { font: 24px/1.25 var(--display); margin: 0; text-wrap: balance; }

.sheet .acts { display: flex; flex-direction: column; gap: 8px; }
.imp {

}

.toast {

  bottom: calc(86px + env(safe-area-inset-bottom, 0px));

.set { display: flex; flex-direction: column; gap: 8px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

.set input[type=range] { width: 100%; accent-color: var(--accent); height: 32px; }
.note { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; font-size: 14px; display: flex; flex-direction: column; gap: 6px; }

.drive-status { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.drive-status .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
.drive-status.ok .dot { background: #3E8E5A; }

.card-acts { grid-column: 1 / -1; display: flex; gap: 8px; margin-top: 8px; }

<script>
(() => {
"use strict";

/* ---------- 저장소 ---------- */
const KEY = "attendance-book.v1";
let db = load();
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && Array.isArray(d.classes)) return { classes: d.classes, sessions: d.sessions || [] };
  } catch (e) {}
  return { classes: [], sessions: [] };
}
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); onDataChanged(); return true; }
  catch (e) { toast("기기에 저장하지 못했어요. 휴대폰 저장 공간을 확인해 주세요."); return false; }
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

/* ---------- 연도·학기 ---------- */
// 1학기: 3~8월, 2학기: 9월~다음 해 2월
function termOf(dt) {
  const y = +dt.slice(0, 4), m = +dt.slice(5, 7);
  return m >= 3 && m <= 8 ? `${y}-1` : m >= 9 ? `${y}-2` : `${y - 1}-2`;
}
const termLabel = t => { const [y, n] = t.split("-"); return `${y}년 ${n}학기`; };
const termCmp = (a, b) => b.localeCompare(a);
db.classes.forEach(c => { if (!c.term) c.term = termOf(c.createdAt || "2026-03-02 00:00"); });
const termClasses = () => db.classes.filter(c => c.term === S.term);

/* ---------- 도우미 ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, "0");
function nowDT() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
const WD = "일월화수목금토";
function prettyDT(dt, withTime = true) {
  const [d, t] = dt.split(" ");
  const [y, m, dd] = d.split("-").map(Number);
  const w = WD[new Date(y, m - 1, dd).getDay()];
  return `${m}월 ${dd}일 (${w})` + (withTime && t ? ` ${t}` : "");
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const byNo = (a, b) => (a.no ?? 9999) - (b.no ?? 9999) || (a.ord ?? 0) - (b.ord ?? 0) || a.name.localeCompare(b.name, "ko");
const getClass = id => db.classes.find(c => c.id === id);
const classSessions = id => db.sessions.filter(s => s.classId === id).sort((a, b) => a.dt.localeCompare(b.dt));
// 그 수업 시각에 명단에 있던 학생
const activeAt = (cls, dt) => cls.students
  .filter(s => (!s.addedAt || s.addedAt <= dt) && (!s.leftAt || s.leftAt > dt))
  .sort(byNo);
// 출석 제외(위탁·수능 준비반 등) 기간: off = [{ from, to, reason }]
const offAt = (s, dt) => { const p = (s.off || []).find(p => p.from <= dt && (!p.to || p.to > dt)); return p ? p.reason : null; };
const offNow = s => { const p = (s.off || []).find(p => !p.to); return p ? p.reason : null; };
// 그 수업 시각에 실제로 출석을 부르는 학생
const callAt = (cls, dt) => activeAt(cls, dt).filter(s => !offAt(s, dt));

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 2600);
}
function sheet(html, mount) {
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  scrim.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(scrim);
  const close = () => scrim.remove();
  scrim.addEventListener("click", e => { if (e.target === scrim) close(); });
  mount && mount(scrim.querySelector(".sheet"), close);
  return close;
}
function ask({ title, body = "", actions }) {
  sheet(`<h2>${esc(title)}</h2>${body ? `<p>${body}</p>` : ""}<div class="acts">${
    actions.map((a, i) => `<button class="btn block ${a.cls || ""}" data-i="${i}">${esc(a.label)}</button>`).join("")
  }</div>`, (el, close) => {
    el.querySelectorAll("[data-i]").forEach(b => b.onclick = () => { close(); const f = actions[+b.dataset.i].fn; f && f(); });
  });
}

function openClass(id, sessionId) {
  const s = sessionId && db.sessions.find(x => x.id === sessionId);
  S.draft = s ? { id: s.id, dt: s.dt, absent: new Set(s.absent), memo: s.memo || "" }
              : { id: null, dt: nowDT(), absent: new Set(), memo: "" };
  S.classId = id; S.view = "class"; S.dirty = false; S.filter = "all";
  const c = getClass(id); if (c && prefs.term !== c.term) { prefs.term = c.term; savePrefs(); }
  history.pushState({ v: "class" }, "");
  render();
}

function prevMemo(cls) {
  const d = S.draft;
  return classSessions(cls.id)
    .filter(s => s.id !== d.id && (s.memo || "").trim() && (!d.id || s.dt < d.dt))
    .pop();
}

const tallyHTML = (all, n, a) => {
  const f = S.filter || "all", on = k => (f === k ? " sel" : "");
  return `<button class="${on("all")}" data-tally="all" aria-pressed="${f === "all"}">재적 ${all}</button><button class="${on("present")}" data-tally="present" aria-pressed="${f === "present"}">출석 ${n - a}</button><button class="abs${on("absent")}" data-tally="absent" aria-pressed="${f === "absent"}">결석 ${a}</button>${all > n ? `<button class="off${on("off")}" data-tally="off" aria-pressed="${f === "off"}">제외 ${all - n}</button>` : ""}`;

// 재적·출석·결석·제외 버튼으로 학생 칸을 골라 보기 (같은 버튼을 다시 누르면 전체)
function drawGrid() {
  const cls = getClass(S.classId), d = S.draft, f = S.filter || "all";
  const all = activeAt(cls, d.dt), call = callAt(cls, d.dt);
  const offs = all.filter(s => offAt(s, d.dt));
  const absentN = call.filter(s => d.absent.has(s.id)).length;
  document.getElementById("tally").innerHTML = tallyHTML(all.length, call.length, absentN);
  let list, tiles;
  if (f === "off") {
    list = offs;
    tiles = list.map(s => `<div class="tile off-tile"><span class="no">${s.no ?? ""}</span><span class="mark offm">${esc(offAt(s, d.dt))}</span><span class="name">${esc(s.name)}</span></div>`).join("");
  } else {
    list = f === "present" ? call.filter(s => !d.absent.has(s.id)) : f === "absent" ? call.filter(s => d.absent.has(s.id)) : call;
    tiles = list.map(s => tileHTML(s, d.absent.has(s.id))).join("");
  }
  const label = { present: "출석", absent: "결석", off: "출석 제외" }[f];
  document.getElementById("filter-note").innerHTML = label
    ? `<span>${label} ${list.length}명만 보는 중</span><button class="btn small" data-tally="all">전체 보기</button>` : "";
  document.getElementById("grid").innerHTML = list.length ? tiles
    : `<p class="help">${f === "all" ? "출석을 부를 학생이 없어요. 위쪽 <b>명단수정</b>에서 학생을 추가해 주세요." : `${label} 학생이 없어요.`}</p>`;
}
const tileHTML = (s, absent) => `<button class="tile ${absent ? "absent" : ""}" data-sid="${s.id}" aria-pressed="${absent}">
  <span class="no">${s.no ?? ""}</span>${absent ? '<span class="mark">결석</span>' : ""}<span class="name">${esc(s.name)}</span></button>`;

function toggle(sid) {
  const d = S.draft;
  if (d.absent.has(sid)) { d.absent.delete(sid); buzz(15); } else { d.absent.add(sid); buzz([30, 40, 30]); }
  S.dirty = true;
  drawGrid();
}

function saveSession() {
  const d = S.draft; const cls = getClass(S.classId);
  const ids = new Set(callAt(cls, d.dt).map(s => s.id));
  const rec = { id: d.id || uid(), classId: cls.id, dt: d.dt, absent: [...d.absent].filter(id => ids.has(id)), memo: d.memo.trim() };
  const i = db.sessions.findIndex(s => s.id === rec.id);
  if (i >= 0) db.sessions[i] = rec; else db.sessions.push(rec);
  if (!persist()) return false;
  const wasNew = !d.id;
  d.id = rec.id; S.dirty = false;
  toast(`${prettyDT(rec.dt)} 출석을 저장했어요 (결석 ${rec.absent.length}명)`);
  if (wasNew) renderClass();
  return true;
}

function leaveClass(after) {
  const go = () => { S.view = "home"; S.draft = null; after ? after() : render(); };
  const d = S.draft;
  if (S.view === "class" && d && (!d.id || S.dirty)) {
    ask({
      title: d.id ? "고친 내용을 저장할까요?" : "출석을 저장하지 않았어요",
      body: d.id ? "저장하지 않으면 바꾼 내용이 사라져요." : "저장하지 않고 나가면 이번 수업 출석이 기록되지 않아요.",
      actions: [
        { label: "저장하고 나가기", cls: "primary", fn: () => { if (saveSession()) go(); } },
        { label: "저장하지 않고 나가기", cls: "danger", fn: go },
        { label: "계속 체크하기", fn: () => history.pushState({ v: "class" }, "") }
      ]
    });
  } else go();
}

/* ---------- 설정 저장 ---------- */
const prefs = (() => { try { return JSON.parse(localStorage.getItem(KEY + ".prefs")) || {}; } catch (e) { return {}; } })();
function savePrefs() { try { localStorage.setItem(KEY + ".prefs", JSON.stringify(prefs)); } catch (e) {} }

/* ---------- 명단 관리 ---------- */
const REASONS = ["위탁", "수능 준비반"];
// 지금 체크 중인(저장 전) 수업이 있으면 그 시각부터 바로 반영
function effT(cls) {
  const now = nowDT(), d = S.draft;
  return d && !d.id && S.classId === cls.id && d.dt < now ? d.dt : now;
}
function setOff(s, reason, cls) {
  const t = effT(cls);
  s.off = s.off || [];
  const cur = s.off.find(p => !p.to);
  if ((cur ? cur.reason : null) === (reason || null)) return;
  if (cur) { if (cur.from >= t) s.off.splice(s.off.indexOf(cur), 1); else cur.to = t; }
  if (reason) s.off.push({ from: t, to: null, reason });
}
const nextNo = cls => cls.students.filter(s => !s.leftAt).reduce((m, s) => Math.max(m, s.no || 0), 0) + 1;

function openRoster() {
  S.rosterFrom = S.view; S.view = "roster";
  history.pushState({ v: "roster" }, "");
  render();
}
function rowHTML(s) {
  const r = offNow(s);
  const pill = s.leftAt ? `<span class="pill gone">${esc(s.leftNote || "전출")}</span>` : r ? `<span class="pill">${esc(r)}</span>` : "";
  return `<button class="srow ${s.leftAt ? "gone" : ""}" data-stu="${s.id}">
    <span class="no">${s.no ?? ""}</span><span class="nm">${esc(s.name)}</span>${pill}<span class="chev">${ICON.chev}</span></button>`;
}
function renderRoster() {
  const cls = getClass(S.classId);
  const cur = cls.students.filter(s => !s.leftAt).sort(byNo);
  const gone = cls.students.filter(s => s.leftAt).sort(byNo);
  const offN = cur.filter(s => offNow(s)).length;
  app.innerHTML = `
    <header class="bar"><div class="wrap">
      <button class="icon-btn" data-act="roster-back" aria-label="뒤로">${ICON.back}</button>
      <h1>${esc(cls.name)} 명단</h1>
    </div></header>
    <main class="wrap">
      <div class="tally"><span>재적 ${cur.length}</span><span>출석 부름 ${cur.length - offN}</span>${offN ? `<span class="off">출석 제외 ${offN}</span>` : ""}</div>
      <div class="roster">${cur.length ? cur.map(rowHTML).join("") : `<p class="help" style="padding:12px">학생이 없어요. 아래에서 추가해 주세요.</p>`}</div>
      <p class="help">학생을 누르면 번호·이름을 고치거나 <b>출석 제외</b>(위탁, 수능 준비반 등), 반 옮기기, 전출을 할 수 있어요.</p>
      ${gone.length ? `<div class="label">명단에서 빠진 학생</div><div class="roster">${gone.map(rowHTML).join("")}</div>` : ""}
    </main>
    <div class="dock"><div class="wrap">
      <button class="btn primary" data-act="add-student">+ 학생 추가</button>
    </div></div>`;
}

      </div>
      <label class="field" id="st-why-f" ${custom ? "" : "hidden"}><span class="label">사유</span><input id="st-why" type="text" maxlength="10" placeholder="예: 장기 입원" value="${custom ? esc(cur) : ""}"></label>
      <p class="help">위탁·수능 준비반·기타 사유를 고른 학생은 명단에 그대로 남지만 터치 출석과 음성 출석에서 빠져요. 엑셀에는 그날 칸에 사유가 적혀요. 다시 수업에 들어오면 <b>복귀함</b>을 눌러 주세요.</p>

    </div>`, (el, close) => {
    let pick = custom ? "기타" : (cur || "");

    };

    if (mv) mv.onclick = () => { close(); moveStudent(cls, s, others); };
    el.querySelector("#st-leave").onclick = () => {

        actions: [{ label: "전출 처리", cls: "primary", fn: () => {
          s.leftAt = effT(cls); s.leftNote = "전출"; if (S.draft) S.draft.absent.delete(s.id);
          persist(); renderRoster(); toast(`${s.name} 학생을 전출 처리했어요`); } }, { label: "취소" }] });
    };
    el.querySelector("#st-del").onclick = () => { close(); confirmDelete(cls, s); };
  });
}
function moveStudent(cls, s, others) {
  sheet(`<h2>${esc(s.name)} 학생을 어느 반으로 옮길까요?</h2>
    <p>${esc(cls.name)}의 지난 출결 기록은 그대로 남고, 옮긴 반에서는 오늘부터 출석을 불러요.</p>
    <div class="acts">${others.map(c => `<button class="btn block" data-to="${c.id}">${esc(c.name)}</button>`).join("")}

    el.querySelector("#mv-cancel").onclick = close;
    el.querySelectorAll("[data-to]").forEach(b => b.onclick = () => {
      const to = getClass(b.dataset.to), t = effT(cls), r = offNow(s);
      s.leftAt = t; s.leftNote = `${to.name}(으)로 이동`;

    });

}
function confirmDelete(cls, s) {
  ask({ title: `${s.name} 학생을 완전히 지울까요?`, body: "이 학생의 지난 출결 기록까지 모두 지워지고 되돌릴 수 없어요. 전학 간 학생이라면 <b>전출 처리</b>를 써 주세요.",
    actions: [{ label: "완전히 지우기", cls: "solid-danger", fn: () => {
      cls.students = cls.students.filter(x => x.id !== s.id);
      db.sessions.forEach(ses => { if (ses.classId === cls.id) ses.absent = ses.absent.filter(id => id !== s.id); });
      if (S.draft) S.draft.absent.delete(s.id);
      persist(); renderRoster(); toast("학생을 지웠어요"); } }, { label: "취소" }] });
}
function addStudent() {
  const cls = getClass(S.classId);

      <label class="field no-f"><span class="label">번호</span><input id="ad-no" type="number" inputmode="numeric" value="${nextNo(cls)}"></label>

    </div>
    <p class="help">추가한 때부터 출석부에 나와요. 그 전 수업 칸은 엑셀에 '-'로 표시돼요.</p>
    <div class="acts">
      <button class="btn primary block" id="ad-save">추가</button>
      <button class="btn block" id="ad-more">추가하고 한 명 더</button>
      <button class="btn block" id="ad-cancel">닫기</button>
    </div>`, (el, close) => {

      <button class="btn primary" data-act="export-one">${ICON.share}이 반 내보내기</button>
    </div></div>`;
}
const nameOfIn = (cls, id) => (cls.students.find(s => s.id === id) || {}).name || "(지운 학생)";

/* ---------- 지난 출석부 조회 ---------- */
function openSession(id) {
  S.sessionId = id; S.view = "session"; S.filter = "all";
  history.pushState({ v: "session" }, "");
  render();
}
function renderSession() {
  const cls = getClass(S.classId);
  const list = classSessions(cls.id);
  const i = list.findIndex(x => x.id === S.sessionId);
  if (i < 0) { S.view = "records"; return render(); }
  const ses = list[i], prev = list[i - 1], next = list[i + 1];
  const absent = new Set(ses.absent);
  const all = activeAt(cls, ses.dt), call = callAt(cls, ses.dt);
  const offs = all.filter(s => offAt(s, ses.dt));
  const f = S.filter || "all", on = k => (f === k ? " sel" : "");
  const shown = f === "absent" ? call.filter(s => absent.has(s.id)) : f === "present" ? call.filter(s => !absent.has(s.id)) : f === "off" ? offs : call;
  const tile = s => offAt(s, ses.dt)
    ? `<div class="tile off-tile"><span class="no">${s.no ?? ""}</span><span class="mark offm">${esc(offAt(s, ses.dt))}</span><span class="name">${esc(s.name)}</span></div>`
    : `<div class="tile view ${absent.has(s.id) ? "absent" : ""}"><span class="no">${s.no ?? ""}</span>${absent.has(s.id) ? '<span class="mark">결석</span>' : ""}<span class="name">${esc(s.name)}</span></div>`;
  const label = { present: "출석", absent: "결석", off: "출석 제외" }[f];
  app.innerHTML = `
    <header class="bar"><div class="wrap">
      <button class="icon-btn" data-act="session-back" aria-label="기록 목록으로">${ICON.back}</button>
      <h1>${esc(cls.name)}</h1>
      <span class="sub">${i + 1} / ${list.length}회</span>
    </div></header>
    <main class="wrap">
      <div class="day-nav">
        <button class="btn" data-act="ses-prev" ${prev ? "" : "disabled"} aria-label="이전 수업">${ICON.back}<span>${prev ? colDT(prev.dt) : "처음"}</span></button>
        <div class="day-now">${prettyDT(ses.dt)}</div>
        <button class="btn" data-act="ses-next" ${next ? "" : "disabled"} aria-label="다음 수업"><span>${next ? colDT(next.dt) : "마지막"}</span>${ICON.chev}</button>
      </div>
      <section class="prev ${ses.memo ? "" : "none"}">
        <span class="label">이날 진도</span>
        <span class="text">${ses.memo ? esc(ses.memo) : "진도 메모가 없어요."}</span>
      </section>
      <div class="tally">
        <button class="${on("all")}" data-vf="all">재적 ${all.length}</button><button class="${on("present")}" data-vf="present">출석 ${call.length - ses.absent.length}</button><button class="abs${on("absent")}" data-vf="absent">결석 ${ses.absent.length}</button>${offs.length ? `<button class="off${on("off")}" data-vf="off">제외 ${offs.length}</button>` : ""}
      </div>
      ${label ? `<div class="filter-note"><span>${label} ${shown.length}명만 보는 중</span><button class="btn small" data-vf="all">전체 보기</button></div>` : ""}
      <div class="grid">${shown.length ? shown.map(tile).join("") : `<p class="help">${label || "출석을 부른"} 학생이 없어요.</p>`}</div>
      ${f === "all" && offs.length ? `<p class="excluded">출석을 부르지 않은 학생 ${offs.length}명 · ${offs.map(s => `${s.no ?? ""} ${esc(s.name)} <b>${esc(offAt(s, ses.dt))}</b>`).join(", ")}</p>` : ""}
      <p class="help">조회 화면이라 여기서는 바뀌지 않아요. 고치려면 아래 <b>이날 출석 고치기</b>를 눌러 주세요.</p>
    </main>
    <div class="dock"><div class="wrap">
      <button class="btn danger" data-del="${ses.id}">기록 지우기</button>
      <button class="btn primary" data-edit="${ses.id}">이날 출석 고치기</button>
    </div></div>`;
}

  <p class="help">첫 줄에 <b>학년, 반, 번호, 이름</b> 제목을 넣은 표가 가장 정확해요. 학년·반·번호는 없으면 빼도 되지만 <b>이름은 꼭 있어야</b> 해요. 반에는 숫자뿐 아니라 <b>A, B, 가, 나</b> 같은 선택반 이름도 쓸 수 있고, '3학년 2반', '3학년 A반'처럼 반이 자동으로 나뉘어요.</p>`;
const digits = v => { const m = String(v ?? "").match(/\d+/); return m ? parseInt(m[0], 10) : null; };
const cellText = v => String(v ?? "").trim();

// 표 한 장 → [{ grade, cls, no, name, line }]
function parseRows(rows) {
  let h = -1, C = {};
  for (let i = 0; i < Math.min(rows.length, 15); i++) {
    const r = (rows[i] || []).map(norm);
    const n = r.findIndex(c => NAME_H.test(c));
    if (n >= 0) {
      h = i;
      C = { name: n, no: r.findIndex(c => NO_H.test(c)), cls: r.findIndex(c => CLS_H.test(c)),
            grade: r.findIndex(c => GRADE_H.test(c)), id: r.findIndex(c => ID_H.test(c)) };
      break;
    }
  }
  const out = [];
  if (h >= 0) {
    for (let i = h + 1; i < rows.length; i++) {
      const r = rows[i] || [];
      const name = cellText(r[C.name]);
      const grade = C.grade >= 0 ? digits(r[C.grade]) : null;
      const clsRaw = C.cls >= 0 ? cellText(r[C.cls]) : "";
      let no = C.no >= 0 ? digits(r[C.no]) : null;
      if (no == null && C.id >= 0) { const dg = String(r[C.id]).replace(/\D/g, ""); if (dg.length >= 3) no = parseInt(dg.slice(-2), 10); }
      if (!name && grade == null && !clsRaw && no == null) continue; // 빈 줄
      if (NAME_H.test(norm(name))) continue;
      out.push({ grade, cls: clsRaw, no, name, line: i + 1 });
    }
  } else {
    // 제목 줄이 없을 때: "숫자 … 한글 이름" 줄을 찾음
    rows.forEach((r, i) => {
      const cells = (r || []).map(cellText);
      const ni = cells.findIndex(c => /^[가-힣]{2,5}$/.test(c));
      if (ni < 1) return;
      const nums = cells.slice(0, ni).filter(c => /^\d{1,5}$/.test(c)).map(Number);
      if (!nums.length) return;
      out.push(numsToRow(nums, cells[ni], i + 1));
    });
  }

}
// 숫자 개수로 학년/반/번호 추정 (학번 한 개면 끝 두 자리가 번호)

// 반 이름: 3 → 3반, A → A반, 가 → 가반, 이미 '반'이 붙었거나 긴 이름(화작A 등)은 그대로

const className = (r, def) => {

// 줄 목록 → 반별로 묶기

    const k = className(r, def);
    if (!out.has(k)) out.set(k, []);
    out.get(k).push({ no: r.no, name: r.name.trim(), ord: i });
  });

}
function parseWorkbook(wb, fileName) {
  const base = fileName.replace(/\.[^.]+$/, "");
  const multi = wb.SheetNames.length > 1;
  const all = [];
  for (const sn of wb.SheetNames) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, defval: "", raw: false });
    const plain = /^(sheet|시트)\s*\d*$/i.test(sn.trim());
    const def = (multi || !plain) ? sn.trim() : base;
    parseRows(rows).forEach(r => all.push(Object.assign(r, { def, sheet: multi ? sn : "" })));
  }
  return all;
}

function fileKind(buf) {
  const h = new Uint8Array(buf.slice(0, 12));
  if (h[0] === 0xFF && h[1] === 0xD8) return "image";
  if (h[0] === 0x89 && h[1] === 0x50) return "image";
  if (h[0] === 0x52 && h[1] === 0x49 && h[2] === 0x46) return "image"; // webp
  if (h[4] === 0x66 && h[5] === 0x74 && h[6] === 0x79 && h[7] === 0x70) return "image"; // heic
  if (h[0] === 0x25 && h[1] === 0x50 && h[2] === 0x44 && h[3] === 0x46) return "pdf";
  return "sheet";
}
function handleBuffer(buf, fileName) {
  const kind = fileKind(buf);
  if (kind === "image") return runOcr(new Blob([buf]));
  if (!window.XLSX) { toast("엑셀 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요."); return; }
  if (kind === "pdf") return ask({ title: "엑셀이 아니라 PDF로 받아졌어요", body: "구글 시트 파일을 휴대폰 파일 선택 창에서 고르면 PDF로 넘어올 수 있어요. 구글 시트 원본이나 엑셀(.xlsx) 파일을 다시 골라 주세요.", actions: [{ label: "확인", cls: "primary" }] });
  let rows;
  try { rows = parseWorkbook(XLSX.read(buf, { type: "array" }), fileName); }
  catch (e) { return ask({ title: "파일을 열지 못했어요", body: "엑셀(.xlsx, .xls), CSV 또는 구글 시트인지 확인해 주세요.", actions: [{ label: "확인", cls: "primary" }] }); }
  if (!rows.some(r => r.name)) {
    return ask({ title: "학생 이름을 찾지 못했어요", body: `표 첫 줄에 <b>학년, 반, 번호, 이름</b> 제목이 있는지 확인해 주세요. 이름 칸은 꼭 있어야 해요.${FORMAT_HTML}<p class="help">파일 이름: ${esc(fileName)}</p>`, actions: [{ label: "확인", cls: "primary" }] });
  }
  const base = fileName.replace(/\.[^.]+$/, "");
  const missing = rows.filter(r => !r.name);
  if (missing.length) {
    const where = missing.slice(0, 6).map(r => `${r.sheet ? r.sheet + " " : ""}${r.line}번째 줄`).join(", ") + (missing.length > 6 ? " …" : "");
    return ask({
      title: `이름이 비어 있는 줄이 ${missing.length}개 있어요`,
      body: `${where}<br>이름은 꼭 있어야 해요. 표에서 이름을 직접 넣거나, 이 줄을 빼고 만들 수 있어요.`,
      actions: [
        { label: "표에서 이름 넣기", cls: "primary", fn: () => openRowEditor(rows, base, "파일에서 읽은 명단") },
        { label: "이름 없는 줄 빼고 계속", fn: () => showImportPreview(groupByDef(rows.filter(r => r.name))) },

}
// 시트마다 기본 반 이름이 다를 수 있어서 시트별로 묶은 뒤 합침
function groupByDef(rows) {
  const out = new Map();
  rows.forEach((r, i) => {
    const k = className(r, r.def || "새 반");
    if (!out.has(k)) out.set(k, []);
    out.get(k).push({ no: r.no, name: r.name.trim(), ord: i });
  });
  return [...out].map(([name, students]) => ({ name, students: students.sort(byNo) }));
}

/* ---------- 확인·고치기 표 ---------- */
function openRowEditor(rows, def, title) {
  let list = rows.map(r => ({ grade: r.grade ?? "", cls: r.cls ?? "", no: r.no ?? "", name: r.name || "", def: r.def || def }));
  sheet(`<h2>${esc(title)}</h2>
    <p class="help">틀린 글자는 눌러서 고치고, 필요 없는 줄은 ✕로 지워 주세요. 학년·반·번호는 비워 둬도 되지만 이름은 꼭 넣어야 해요.</p>
    <div class="ed-head"><span>학년</span><span>반</span><span>번호</span><span>이름</span><span></span></div>
    <div class="ed" id="ed"></div>
    <button class="btn block" id="ed-add">+ 줄 추가</button>
    <div class="ed-warn" id="ed-warn" hidden></div>
    <div class="acts">
      <button class="btn primary block" id="ed-go">이 명단으로 반 만들기</button>
      <button class="btn block" id="ed-cancel">취소</button>
    </div>`, (el, close) => {
    const box = el.querySelector("#ed");
    const draw = () => {
      box.innerHTML = list.map((r, i) => `<div class="ed-row ${r.name.trim() ? "" : "bad"}" data-i="${i}">
        <input inputmode="numeric" data-k="grade" value="${esc(r.grade)}" aria-label="학년">
        <input data-k="cls" value="${esc(r.cls)}" aria-label="반">
        <input inputmode="numeric" data-k="no" value="${esc(r.no)}" aria-label="번호">
        <input data-k="name" value="${esc(r.name)}" placeholder="이름 필요" aria-label="이름">
        <button class="ed-x" data-x="${i}" aria-label="줄 지우기">✕</button></div>`).join("");
    };
    draw();
    box.addEventListener("input", e => {
      const row = e.target.closest(".ed-row"); if (!row) return;
      const r = list[+row.dataset.i]; r[e.target.dataset.k] = e.target.value;
      if (e.target.dataset.k === "name") row.classList.toggle("bad", !e.target.value.trim());
    });
    box.addEventListener("click", e => {
      const x = e.target.closest("[data-x]"); if (!x) return;
      list.splice(+x.dataset.x, 1); draw();
    });
    el.querySelector("#ed-add").onclick = () => {
      const last = list[list.length - 1] || {};
      list.push({ grade: last.grade ?? "", cls: last.cls ?? "", no: digits(last.no) != null ? digits(last.no) + 1 : "", name: "", def });
      draw(); const ins = box.querySelectorAll('[data-k="name"]'); ins[ins.length - 1].focus();
    };
    el.querySelector("#ed-cancel").onclick = close;
    el.querySelector("#ed-go").onclick = () => {
      const empty = list.filter(r => !r.name.trim()).length;
      const warn = el.querySelector("#ed-warn");
      if (!list.length) { warn.hidden = false; warn.textContent = "학생이 한 명도 없어요. 줄을 추가해 주세요."; return; }
      if (empty) {
        warn.hidden = false; warn.textContent = `이름이 비어 있는 줄이 ${empty}개 있어요. 이름을 넣거나 ✕로 지워 주세요.`;
        const bad = box.querySelector(".ed-row.bad input[data-k=name]"); if (bad) { bad.focus(); bad.scrollIntoView({ block: "center" }); }

      }
      close();
      showImportPreview(groupByDef(list.map(r => ({ grade: digits(r.grade), cls: cellText(r.cls).replace(/반$/, ""), no: digits(r.no), name: r.name, def: r.def }))));

  });
}

/* ---------- 명단 사진 인식 (폰 안에서 처리) ---------- */
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
let ocrWorker = null;
async function getOcr(onProgress) {
  if (!window.Tesseract) await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js");
  if (!ocrWorker) {
    ocrWorker = await Tesseract.createWorker(["kor", "eng"], 1, { logger: m => onProgress && onProgress(m) });
    await ocrWorker.setParameters({ tessedit_pageseg_mode: "4", preserve_interword_spaces: "1" });
  }

}
// 크기를 맞추고 흑백·대비를 높여 글자를 잘 보이게
async function prepImage(blob) {
  const url = URL.createObjectURL(blob);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const scale = Math.min(2, 2000 / Math.max(img.width, img.height));
    const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const g = c.getContext("2d"); g.drawImage(img, 0, 0, w, h);
    const d = g.getImageData(0, 0, w, h), p = d.data;
    let lo = 255, hi = 0;
    for (let i = 0; i < p.length; i += 16) { const v = p[i] * .3 + p[i + 1] * .59 + p[i + 2] * .11; if (v < lo) lo = v; if (v > hi) hi = v; }
    if (hi - lo < 40) { lo = 0; hi = 255; } // 대비가 거의 없으면 늘리지 않음
    const span = hi - lo;
    for (let i = 0; i < p.length; i += 4) {
      let v = (p[i] * .3 + p[i + 1] * .59 + p[i + 2] * .11 - lo) * 255 / span;
      v = v < 0 ? 0 : v > 255 ? 255 : v;
      p[i] = p[i + 1] = p[i + 2] = v;
    }
    g.putImageData(d, 0, 0);
    return c;
  } finally { URL.revokeObjectURL(url); }
}
const NOT_NAME = /^(학년|번호|이름|성명|명단|출석부|학생|비고|합계)$/;
// 사진 글자 → 줄 목록. 반은 숫자(3)뿐 아니라 글자(A, 가, C반)도 받음
const CLS_TOKEN = /^([A-Za-z]{1,2}|[가-힣]|[0-9A-Za-z가-힣]{1,3}반)$/;
function parseOcrText(text) {
  const rows = []; let cols = null, afterHeader = false;
  text.split("\n").forEach((raw, i) => {
    const line = raw.trim(); if (!line) return;
    const compact = line.replace(/\s+/g, "");
    if (/(이름|성명)/.test(compact) && (/(학년|번호)/.test(compact) || /반/.test(compact.replace(/학년/g, "")))) {
      cols = [];
      if (/학년/.test(compact)) cols.push("grade");
      if (/반/.test(compact.replace(/학년/g, ""))) cols.push("cls");
      if (/번호|번/.test(compact.replace(/반/g, ""))) cols.push("no");
      afterHeader = true; return;
    }
    const names = (line.match(/[가-힣]{2,5}/g) || []).filter(n => !NOT_NAME.test(n) && !/반$/.test(n));
    const name = names.length ? names[names.length - 1] : "";
    const before = name ? line.slice(0, line.lastIndexOf(name)) : line;
    const toks = before.split(/[\s|ㅣ。.,:;]+/).filter(t => /^\d+$/.test(t) || CLS_TOKEN.test(t));
    if (!name && !(afterHeader && toks.length)) return;
    if (!name && !toks.length) return;
    const row = { grade: null, cls: "", no: null, name, line: i + 1 };
    if (cols && cols.length) {
      toks.slice(-cols.length).forEach((t, k) => {
        const key = cols[cols.length - Math.min(cols.length, toks.length) + k];
        if (key === "cls") row.cls = t.replace(/반$/, "");
        else if (/^\d+$/.test(t)) row[key] = Number(t);
      });
    } else {
      const ci = toks.findIndex(t => !/^\d+$/.test(t));
      if (ci >= 0) {
        row.cls = toks[ci].replace(/반$/, "");
        const pre = toks.slice(0, ci), post = toks.slice(ci + 1);
        if (pre.length) row.grade = Number(pre[pre.length - 1]);
        if (post.length) row.no = Number(post[0]);
      } else {
        Object.assign(row, numsToRow(toks.map(Number), name, i + 1));
      }
    }
    rows.push(row);
  });
  return rows;
}
// 제목 줄(학년·반·번호·이름)의 가로 위치로 칸을 나눠 읽음 — 빈 칸이 있어도 칸이 밀리지 않음
function parseOcrLayout(data) {
  const lines = (data && data.lines) || [];

  let col = null, hi = -1;
  for (let i = 0; i < lines.length && i < 8; i++) {
    const c = {};
    lines[i].words.forEach(w => {
      const t = w.text.replace(/\s+/g, "");
      if (/학년/.test(t)) c.grade = cx(w);
      else if (/번호|^번$/.test(t)) c.no = cx(w);
      else if (/이름|성명/.test(t)) c.name = cx(w);
      else if (/반/.test(t)) c.cls = cx(w);
    });
    if (c.name != null && Object.keys(c).length >= 2) { col = c; hi = i; break; }
  }
  if (!col) return null;
  const keys = Object.keys(col);
  const nearest = x => keys.reduce((b, k) => Math.abs(col[k] - x) < Math.abs(col[b] - x) ? k : b, keys[0]);
  const rows = [];
  lines.slice(hi + 1).forEach((ln, i) => {
    const cell = {};
    ln.words.forEach(w => { const t = w.text.trim(); if (!t) return; const k = nearest(cx(w)); cell[k] = (cell[k] || "") + t; });
    const name = (cell.name || "").replace(/[^가-힣A-Za-z]/g, "");
    let cls = (cell.cls || "").replace(/[|ㅣ。.,:;]/g, "").replace(/\^/g, "A").replace(/반$/, "");
    const grade = digits(cell.grade), no = digits(cell.no);
    if (!name && grade == null && !cls && no == null) return;
    if (NOT_NAME.test(name)) return;
    rows.push({ grade, cls, no, name, line: hi + i + 2 });
  });

}
async function runOcr(blob) {
  let closeWait;

    <p id="ocr-msg">글자 인식 도구를 준비하고 있어요. 처음 한 번은 1분쯤 걸릴 수 있어요.</p>

        actions: [{ label: "다른 스크린샷 고르기", cls: "primary", fn: pickPhoto }, { label: "표에 직접 입력하기", fn: () => openRowEditor([], "새 반", "명단 직접 입력") }, { label: "닫기" }] });
    }

function applyImport(name, list) {
  const cls = termClasses().find(c => c.name === name);
  if (!cls) {
    db.classes.push({ id: uid(), name, term: S.term, createdAt: nowDT(),
      students: list.map((s, i) => ({ id: uid(), no: s.no, ord: i, name: s.name, addedAt: null, leftAt: null, off: [] })) });
    return;
  }
  // 같은 반이면 이름으로 맞춰 기존 기록을 유지
  const now = nowDT(), used = new Set();
  const next = list.map((s, i) => {
    const ex = cls.students.find(x => x.name === s.name && !used.has(x.id));
    if (ex) { used.add(ex.id); ex.no = s.no; ex.ord = i; ex.leftAt = null; ex.leftNote = null; return ex; }
    return { id: uid(), no: s.no, ord: i, name: s.name, addedAt: now, leftAt: null, off: [] };
  });
  cls.students.forEach(s => { if (!used.has(s.id)) { if (!s.leftAt) { s.leftAt = now; s.leftNote = "전출"; } next.push(s); } });
  cls.students = next;
}

/* ---------- 엑셀 내보내기 ---------- */
function sheetName(name, used) {
  let base = name.replace(/[\[\]:*?\/\\]/g, " ").trim().slice(0, 28) || "반";
  let n = base, k = 2;
  while (used.has(n)) n = `${base} ${k++}`;
  used.add(n); return n;
}
// 엑셀 날짜 칸: 11/04(수) 13:20
function colDT(dt) {
  const [d, t] = dt.split(" ");
  const [y, m, dd] = d.split("-").map(Number);
  return `${pad(m)}/${pad(dd)}(${WD[new Date(y, m - 1, dd).getDay()]}) ${t}`;
}
function buildWorkbook(classes) {
  const wb = XLSX.utils.book_new();
  const used = new Set(["진도 기록"]);
  const stamp = nowDT();
  const prog = [["반", "수업 일시", "재적", "출석", "결석", "제외", "결석 학생", "진도 메모"]];
  for (const cls of classes) {
    const ses = classSessions(cls.id);
    const studs = [...cls.students].sort(byNo);
    const aoa = [
      [`${cls.name} 출석부`],
      [`내보낸 시각 ${stamp}  ·  O = 출석, X = 결석, 위탁·수능 준비반 등 = 출석 제외, - = 그때 명단에 없음`],
      [],
      ["번호", "이름", ...ses.map(s => colDT(s.dt)), "출석 수", "결석 수"]
    ];
    for (const st of studs) {
      let p = 0, a = 0;
      const cells = ses.map(s => {
        if ((st.addedAt && st.addedAt > s.dt) || (st.leftAt && st.leftAt <= s.dt)) return "-";
        const r = offAt(st, s.dt); if (r) return r;
        if (s.absent.includes(st.id)) { a++; return "X"; }
        p++; return "O";
      });
      aoa.push([st.no, st.name + (st.leftAt ? ` (${st.leftNote || "전출"})` : ""), ...cells, p, a]);
    }
    aoa.push(["", "결석 인원", ...ses.map(s => s.absent.length), "", ""]);
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws["!cols"] = [{ wch: 6 }, { wch: 14 }, ...ses.map(() => ({ wch: 14 })), { wch: 8 }, { wch: 8 }];
    XLSX.utils.book_append_sheet(wb, ws, sheetName(cls.name, used));
    for (const s of ses) {
      const all = activeAt(cls, s.dt).length, n = callAt(cls, s.dt).length;
      const names = s.absent.map(id => (cls.students.find(x => x.id === id) || {}).name).filter(Boolean).join(", ");
      prog.push([cls.name, colDT(s.dt), all, n - s.absent.length, s.absent.length, all - n, names, s.memo || ""]);
    }
  }
  const pws = XLSX.utils.aoa_to_sheet(prog);
  pws["!cols"] = [{ wch: 14 }, { wch: 15 }, { wch: 6 }, { wch: 6 }, { wch: 6 }, { wch: 6 }, { wch: 24 }, { wch: 50 }];
  XLSX.utils.book_append_sheet(wb, pws, "진도 기록");
  return wb;
}
function exportFile(classes) {
  const d = nowDT().slice(0, 10);
  const label = classes.length === 1 ? classes[0].name : termLabel(classes[0] ? classes[0].term : S.term).replace(/ /g, "");
  const fname = `출석부_${label}_${d}.xlsx`.replace(/[\\/:*?"<>|]/g, "_");
  const data = XLSX.write(buildWorkbook(classes), { bookType: "xlsx", type: "array" });
  const type = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
  return { fname, blob: new Blob([data], { type }), file: new File([data], fname, { type }) };
}
// 안드로이드 크롬·삼성 인터넷은 공유 메뉴로 .xlsx를 보낼 수 없어서(허용 형식 제한) CSV로 보냄
function csvFiles(classes) {
  const d = nowDT().slice(0, 10);
  return classes.map(cls => {
    const wb = buildWorkbook([cls]);
    const main = XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]]);
    const prog = XLSX.utils.sheet_to_csv(wb.Sheets["진도 기록"]);
    const text = "\uFEFF" + main + "\n\n진도 기록\n" + prog;
    const fname = `출석부_${cls.name}_${d}.csv`.replace(/[\\/:*?"<>|]/g, "_");
    return new File([text], fname, { type: "text/csv" });
  });
}

let tokenClient = null, waiters = [];
function finishToken(err, r) {
  const w = waiters; waiters = [];
  if (err) return w.forEach(x => x.rej(err));
  tok = { access_token: r.access_token, exp: Date.now() + (r.expires_in - 60) * 1000 };
  try { sessionStorage.setItem(KEY + ".tok", JSON.stringify(tok)); } catch (e) {}
  w.forEach(x => x.res(tok.access_token));
}
function getToken(interactive) {
  if (tok && tok.exp > Date.now()) return Promise.resolve(tok.access_token);
  if (!interactive) return Promise.reject(new Error("needs_click"));
  if (!(window.google && google.accounts && google.accounts.oauth2)) return Promise.reject(new Error("gis_not_loaded"));
  if (!tokenClient) tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: DRIVE.clientId, scope: SCOPE,
    callback: r => r.error ? finishToken(new Error(r.error)) : finishToken(null, r),
    error_callback: e => finishToken(new Error(e && e.type || "popup_failed"))
  });
  return new Promise((res, rej) => {
    waiters.push({ res, rej });
    if (waiters.length === 1) tokenClient.requestAccessToken(Object.assign({ prompt: dprefs.connected ? "" : "consent" }, dprefs.email ? { login_hint: dprefs.email } : {}));
  });
}
async function gfetch(url, opts, interactive) {
  const t = await getToken(interactive);
  const r = await fetch(url, Object.assign({}, opts, { headers: Object.assign({}, (opts || {}).headers, { Authorization: "Bearer " + t }) }));
  if (r.status === 401) { tok = null; try { sessionStorage.removeItem(KEY + ".tok"); } catch (e) {} throw new Error("expired"); }
  if (!r.ok) throw new Error("http_" + r.status);
  return r;
}
const gjson = async (url, opts, i) => (await gfetch(url, opts, i)).json();
const isAuthErr = e => /needs_click|expired|gis_not_loaded|popup|access_denied/.test(e.message);
const q = s => encodeURIComponent(s);

async function aliveId(id, i) {
  if (!id) return null;
  try { const j = await gjson(`${API}/${id}?fields=id,trashed`, {}, i); return j.trashed ? null : j.id; }
  catch (e) { if (isAuthErr(e)) throw e; return null; }
}
async function ensureFolder(i) {
  let id = await aliveId(dprefs.folderId, i);
  if (!id) {
    const l = await gjson(`${API}?q=${q(`name='${FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`)}&fields=files(id)`, {}, i);
    id = l.files[0] ? l.files[0].id : (await gjson(`${API}?fields=id`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: FOLDER_NAME, mimeType: "application/vnd.google-apps.folder" })
    }, i)).id;
  }
  dprefs.folderId = id; savePrefs(); return id;
}
async function findInFolder(name, i) {
  const folder = await ensureFolder(i);
  const l = await gjson(`${API}?q=${q(`name='${name}' and '${folder}' in parents and trashed=false`)}&orderBy=modifiedTime desc&fields=files(id,modifiedTime)`, {}, i);
  return l.files[0] || null;
}
async function upsert(name, mime, blob, idKey, i) {
  const folder = await ensureFolder(i);
  let id = await aliveId(dprefs[idKey], i);
  if (!id) { const f = await findInFolder(name, i); id = f && f.id; }
  const fd = new FormData();
  fd.append("metadata", new Blob([JSON.stringify(id ? { name } : { name, parents: [folder], mimeType: mime })], { type: "application/json" }));
  fd.append("file", blob);
  const j = await gjson(id ? `${UP}/${id}?uploadType=multipart&fields=id` : `${UP}?uploadType=multipart&fields=id`, { method: id ? "PATCH" : "POST", body: fd }, i);
  dprefs[idKey] = j.id; savePrefs(); return j.id;
}

let syncing = null;
function syncDrive(interactive) {
  if (!driveConfigured() || !dprefs.connected) return Promise.resolve(false);
  if (syncing) return syncing;

    try {
      const backup = { app: "attendance-book", version: 1, savedAt: nowDT(), data: db };

}
async function driveExportNow() {
  if (!dprefs.connected) return openDriveSettings();
  const ok = await syncDrive(true);
  if (ok) toast(`드라이브 '${FOLDER_NAME}' 폴더의 '${sheetNameOf(S.term)}' 구글 시트에 저장했어요`);
  else toast("드라이브에 저장하지 못했어요. 인터넷 연결을 확인해 주세요.");
}

// 드라이브에서 명단 엑셀 고르기 (Google Picker)
function loadPicker() {
  return new Promise((res, rej) => {
    if (window.google && google.picker) return res();
    if (!window.gapi) return rej(new Error("gis_not_loaded"));
    gapi.load("picker", { callback: res, onerror: () => rej(new Error("gis_not_loaded")) });
  });
}
async function pickFromDrive() {
  let t;
  try { t = await getToken(true); await loadPicker(); }
  catch (e) { return driveError(e); }
  if (!dprefs.connected) { dprefs.connected = true; savePrefs(); }
  const view = new google.picker.DocsView(google.picker.ViewId.DOCS)
    .setMimeTypes([XLSX_MIME, "application/vnd.ms-excel", "text/csv", "application/vnd.google-apps.spreadsheet"].join(","))
    .setMode(google.picker.DocsViewMode.LIST);
  new google.picker.PickerBuilder()
    .addView(view).setOAuthToken(t).setDeveloperKey(DRIVE.apiKey).setAppId(DRIVE.appId)
    .setLocale("ko").setTitle("명단 고르기 (학년·반·번호·이름 표)")
    .setCallback(async data => {
      if (data.action !== google.picker.Action.PICKED) return;
      const f = data.docs[0];
      try {
        toast("파일을 불러오는 중이에요");
        const url = f.mimeType === "application/vnd.google-apps.spreadsheet"
          ? `${API}/${f.id}/export?mimeType=${q(XLSX_MIME)}` : `${API}/${f.id}?alt=media`;
        const buf = await (await gfetch(url, {}, true)).arrayBuffer();
        handleBuffer(buf, f.name);
      } catch (e) { driveError(e); }
    })
    .build().setVisible(true);
}

function openImportChoice() {
  const drive = driveConfigured() && DRIVE.apiKey;
  sheet(`<h2>명단 올리기</h2>
    <p>아래 양식의 표를 구글 드라이브에서 고르거나, 명렬표를 화면 캡처한 <b>스크린샷</b>을 갤러리에서 골라 주세요.</p>
    ${FORMAT_HTML}
    <div class="acts">
      ${drive ? `<button class="btn primary block" id="im-drive">${ICON.drive}구글 드라이브에서 고르기</button>` : ""}
      <button class="btn ${drive ? "" : "primary"} block" id="im-photo">${ICON.image}갤러리에서 명렬표 스크린샷 고르기</button>
      <button class="btn block" id="im-type">표에 직접 입력하기</button>
      <button class="btn block" id="im-cancel">취소</button>
    </div>`, (el, close) => {
    const on = (id, fn) => { const b = el.querySelector(id); if (b) b.onclick = () => { close(); fn(); }; };
    on("#im-drive", pickFromDrive);
    on("#im-photo", pickPhoto);
    on("#im-type", () => openRowEditor([{ grade: "", cls: "", no: 1, name: "" }], "새 반", "명단 직접 입력"));
    on("#im-cancel", () => {});
  });
}
function openSettings() { openDriveSettings(); }
function openDriveSettings() {
  if (!driveConfigured()) {
    return ask({ title: "구글 드라이브 연결 준비 중", body: "앱에 구글 연결 정보가 아직 들어가지 않았어요. 준비가 끝나면 이 화면에서 연결할 수 있어요.", actions: [{ label: "확인", cls: "primary" }] });
  }
  const c = dprefs.connected;
  const state = !c ? "" : dprefs.pending ? "wait" : "ok";
  const msg = !c ? "아직 연결하지 않았어요"
    : syncing ? "백업하는 중이에요"
    : dprefs.pending ? "백업을 기다리는 중이에요"
    : dprefs.lastSync ? `마지막 백업 ${prettyDT(dprefs.lastSync)}` : "연결됨";
  const who = c && dprefs.email ? `<p class="help">연결된 계정: <b>${esc(dprefs.email)}</b></p>` : "";
  sheet(`<h2>구글 드라이브 백업</h2>
    <div class="drive-status ${state}"><span class="dot"></span><span>${msg}</span></div>${who}
    <p>출석을 저장할 때마다 내 드라이브의 <b>'${FOLDER_NAME}'</b> 폴더에 백업 파일과 학기별 출석부 구글 시트('${sheetNameOf(S.term)}' 등)를 자동으로 저장해요. 이 앱이 만든 파일만 다루고, 드라이브의 다른 파일은 보지 않아요.</p>
    <div class="acts">
      ${c ? `
        <button class="btn primary block" id="dv-sync">지금 백업하기</button>
        <button class="btn block" id="dv-restore">백업에서 불러오기</button>
        ${dprefs.folderId ? `<a class="btn block" href="https://drive.google.com/drive/folders/${esc(dprefs.folderId)}" target="_blank" rel="noopener">드라이브 폴더 열기</a>` : ""}
        <button class="btn danger block" id="dv-off">연결 끊기</button>`
      : `<button class="btn primary block" id="dv-on">${ICON.drive}구글 계정 연결하기</button>`}
      <button class="btn block" id="dv-close">닫기</button>
    </div>`, (el, close) => {
    const on = (id, fn) => { const b = el.querySelector(id); if (b) b.onclick = fn; };
    on("#dv-on", () => { close(); connectDrive(); });
    on("#dv-sync", () => { close(); syncDrive(true).then(ok => toast(ok ? "드라이브에 백업했어요" : "백업하지 못했어요. 인터넷 연결을 확인해 주세요")); });
    on("#dv-restore", () => { close(); restoreDrive(); });
    on("#dv-off", () => { close(); ask({ title: "드라이브 연결을 끊을까요?", body: "자동 백업이 멈춰요. 드라이브에 저장된 파일은 지워지지 않아요.", actions: [{ label: "연결 끊기", cls: "solid-danger", fn: disconnectDrive }, { label: "취소" }] }); });
    on("#dv-close", close);
  });
}

/* ---------- 예시 반 ---------- */
function loadDemo() {
  const names = ["강민준","김서연","김하준","박지우","박도윤","이서윤","이시우","정하은","최지호","한수아","오예준","윤채원","임건우","장유나","조은우","황지민"];
  const cls = { id: uid(), name: "예시 2학년 3반", term: S.term, createdAt: nowDT(),
    students: names.map((n, i) => ({ id: uid(), no: i + 1, name: n, addedAt: null, leftAt: null })) };
  db.classes.push(cls);
  const day = k => { const d = new Date(); d.setDate(d.getDate() - k); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  db.sessions.push(
    { id: uid(), classId: cls.id, dt: `${day(7)} 10:10`, absent: [cls.students[3].id], memo: "1단원 매체의 개념 정리, 모둠별 사례 찾기" },
    { id: uid(), classId: cls.id, dt: `${day(2)} 13:20`, absent: [cls.students[5].id, cls.students[11].id], memo: "2단원 매체 언어의 특성 — 활동지 3번까지" }
  );
  persist(); render();
  toast("예시 반을 만들었어요. 다 보셨으면 '반 편집'에서 지울 수 있어요");
}

/* ---------- 이벤트 ---------- */
app.addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.sid) return toggle(t.dataset.sid);
  if (t.dataset.open) return openClass(t.dataset.open);
  if (t.dataset.stu) return openStudent(t.dataset.stu);
  if (t.dataset.view) return openSession(t.dataset.view);
  if (t.dataset.vf) { S.filter = S.filter === t.dataset.vf ? "all" : t.dataset.vf; return renderSession(); }
  if (t.dataset.tally) { const k = t.dataset.tally; S.filter = S.filter === k || k === "all" ? "all" : k; return drawGrid(); }
  if (t.dataset.delclass) return deleteClass(getClass(t.dataset.delclass));
  if (t.dataset.rename) return renameClass(getClass(t.dataset.rename));
  if (t.dataset.edit) { S.view = "class"; const s = db.sessions.find(x => x.id === t.dataset.edit);
    S.draft = { id: s.id, dt: s.dt, absent: new Set(s.absent), memo: s.memo || "" }; S.dirty = false; S.filter = "all"; return render(); }
  if (t.dataset.del) {
    const s = db.sessions.find(x => x.id === t.dataset.del);
    return ask({ title: `${prettyDT(s.dt)} 기록을 지울까요?`, body: "지운 기록은 되돌릴 수 없어요.",
      actions: [{ label: "지우기", cls: "solid-danger", fn: () => { db.sessions = db.sessions.filter(x => x.id !== s.id); persist(); if (S.view === "session") { history.back(); } else render(); toast("기록을 지웠어요"); } }, { label: "취소" }] });
  }
  const cls = getClass(S.classId);
  switch (t.dataset.act) {
    case "import": openImportChoice(); break;
    case "demo": loadDemo(); break;
    case "export": exportSheet(termClasses(), `${termLabel(S.term)} 출석부 내보내기`); break;
    case "term": openTermSheet(); break;
    case "edit-home": S.editHome = !S.editHome; render(); break;
    case "export-one": exportSheet([cls], `${cls.name} 내보내기`); break;
    case "save": saveSession(); break;
    case "session-back": history.back(); break;
    case "ses-prev": case "ses-next": {
      const list = classSessions(S.classId), i = list.findIndex(x => x.id === S.sessionId);
      const to = list[i + (t.dataset.act === "ses-prev" ? -1 : 1)];
      if (to) { S.sessionId = to.id; S.filter = "all"; render(); }
      break;
    }
    case "roster": openRoster(); break;
    case "roster-back": history.back(); break;
    case "add-student": addStudent(); break;
    case "settings": openSettings(); break;
    case "sync-now": syncDrive(true).then(ok => toast(ok ? "드라이브에 백업했어요" : "백업하지 못했어요. 인터넷 연결을 확인해 주세요")); break;
    case "back": history.back(); break;
    case "records":
      if (S.dirty || !S.draft.id) {
        ask({ title: "출석을 먼저 저장할까요?", body: "과거조회 화면으로 가면 지금 체크한 내용이 사라져요.",
          actions: [{ label: "저장하고 과거조회", cls: "primary", fn: () => { if (saveSession()) { S.view = "records"; render(); } } },
                    { label: "저장하지 않고 과거조회", cls: "danger", fn: () => { S.view = "records"; render(); } },
                    { label: "계속 체크하기" }] });
      } else { S.view = "records"; render(); }
      break;
    case "to-class": case "new-session":
      S.draft = { id: null, dt: nowDT(), absent: new Set(), memo: "" }; S.dirty = false; S.filter = "all"; S.view = "class"; render(); break;
    case "del-class":
      deleteClass(cls, () => { S.view = "home"; S.classId = null; history.back(); render(); });
      break;
  }
});



// 휴대폰 뒤로 가기
window.addEventListener("popstate", () => {
  if (S.view === "roster") { S.view = S.rosterFrom || "class"; return render(); }
  if (S.view === "home") return;
  if (S.view === "session") { S.view = "records"; return render(); }
  if (S.view === "records") { S.view = "home"; S.draft = null; return render(); }
  leaveClass();
});
window.addEventListener("beforeunload", e => {
  if (S.view === "class" && S.dirty) { e.preventDefault(); e.returnValue = ""; }
});

// 테스트용으로 바깥에 노출
window.__att = { parseRows, parseWorkbook, buildWorkbook, get db() { return db; } };

// 앱을 열면 마지막으로 쓰던 학기로 (없으면 가장 최근 수업한 반의 학기, 그것도 없으면 지금 학기)
function startTerm() {
  if (prefs.term) return prefs.term;
  const last = [...db.sessions].sort((a, b) => b.dt.localeCompare(a.dt))[0];
  const c = last && getClass(last.classId);
  if (c) return c.term;
  const terms = [...new Set(db.classes.map(c => c.term))].sort(termCmp);
  return terms[0] || termOf(nowDT());
}
S.term = startTerm();

document.getElementById("photo").addEventListener("change", e => {
  const f = e.target.files[0]; e.target.value = "";
  if (f) runOcr(f);
});

render();
setTimeout(() => { if (dprefs.connected && dprefs.pending) syncDrive(false); }, 1500);
window.addEventListener("online", () => { if (dprefs.connected && dprefs.pending) syncDrive(false); });

if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
})();
</script>
