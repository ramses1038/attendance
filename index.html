<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1620" media="(prefers-color-scheme: dark)">
<title>수업 출석부</title>

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="apple-mobile-web-app-title" content="출석부">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">

  if (!window.XLSX) document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\/script>');

<style>
/* 레이아웃: 한 줄 세로 기둥(최대 720px) — 위 고정 머리줄, 학생 칸 격자, 아래 고정 저장 막대 */
:root {
  --bg: #F2F4F7;
  --surface: #FFFFFF;
  --ink: #18263A;
  --muted: #5D6B7E;
  --line: #D9DFE7;
  --accent: #2C5A8C;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3ECF6;
  --absent: #C2412F;
  --absent-bg: #FBE6E2;
  --absent-ink: #8E2A1D;
  --shadow: 0 1px 2px rgba(24,38,58,.06), 0 4px 14px rgba(24,38,58,.06);
  --display: "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "IBM Plex Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --r: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1620; --surface: #18222F; --ink: #E6EBF2; --muted: #93A1B3; --line: #2A3646;
    --accent: #84B2E3; --accent-ink: #0F1620; --accent-soft: #1F3246;
    --absent: #FF8C7C; --absent-bg: #3B2020; --absent-ink: #FFC4BA;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1620; --surface: #18222F; --ink: #E6EBF2; --muted: #93A1B3; --line: #2A3646;
  --accent: #84B2E3; --accent-ink: #0F1620; --accent-soft: #1F3246;
  --absent: #FF8C7C; --absent-bg: #3B2020; --absent-ink: #FFC4BA;
  --shadow: 0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.55 var(--body);
  -webkit-tap-highlight-color: transparent;
  word-break: keep-all;
  min-height: 100dvh;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.wrap {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* 머리줄 */
.bar {
  position: sticky; top: 0; z-index: 5;
  background: var(--bg);
  padding-top: env(safe-area-inset-top, 0px);
  border-bottom: 1px solid var(--line);
}
.bar .wrap { display: flex; align-items: center; gap: 8px; min-height: 58px; padding-block: 6px; }
.bar h1 { font: 26px/1.1 var(--display); margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .sub { color: var(--muted); font-size: 13px; white-space: nowrap; }
.icon-btn {
  border: 0; background: transparent; border-radius: 10px;
  min-width: 44px; height: 44px; padding: 0 10px;
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  color: var(--ink); font-weight: 500;
}
.icon-btn:active { background: var(--accent-soft); }
.icon-btn svg { width: 22px; height: 22px; }

main.wrap { padding-block: 16px 140px; display: flex; flex-direction: column; gap: 16px; }

/* 버튼 */
.btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 12px; min-height: 48px; padding: 0 16px; font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--absent); }
.btn.solid-danger { background: var(--absent); border-color: var(--absent); color: #fff; }
.btn:active { transform: translateY(1px); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .35; cursor: default; }
.btn svg { width: 20px; height: 20px; }

.label { font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--muted); }

/* 반 목록 */
.class-list { display: flex; flex-direction: column; gap: 10px; }
.class-card {
  text-align: left; width: 100%;
  border: 1px solid var(--line); background: var(--surface); border-radius: var(--r);
  padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center;
  box-shadow: var(--shadow);
}
.class-card .name { font: 24px/1.2 var(--display); }
.class-card .meta { grid-column: 1; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.class-card .memo { grid-column: 1 / -1; margin-top: 6px; font-size: 14px; color: var(--ink); background: var(--bg); border-radius: 8px; padding: 6px 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.class-card .chev { grid-row: 1 / span 2; grid-column: 2; color: var(--muted); }

.empty {
  border: 1.5px dashed var(--line); border-radius: var(--r); padding: 28px 20px;
  text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center;
}
.empty h2 { font: 24px/1.3 var(--display); margin: 0; text-wrap: balance; }
.empty p { margin: 0; color: var(--muted); max-width: 34em; }
.empty .btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

.help { color: var(--muted); font-size: 13px; }
.help b { color: var(--ink); font-weight: 600; }

/* 지난 진도 */
.prev {
  background: var(--accent-soft); border-radius: var(--r); padding: 12px 14px;
  display: flex; flex-direction: column; gap: 4px;
}
.prev .when { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.prev .text { white-space: pre-wrap; font-size: 15px; }
.prev.none .text { color: var(--muted); }

/* 일시 + 재적 */
.session-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.dt-field { display: flex; align-items: center; gap: 8px; }
.dt-field input {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
  min-height: 44px; padding: 0 10px; font-variant-numeric: tabular-nums;
}
.tally { display: flex; gap: 6px; font-variant-numeric: tabular-nums; }
.tally span { border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 600; background: var(--surface); border: 1px solid var(--line); }
.tally .abs { background: var(--absent-bg); color: var(--absent-ink); border-color: transparent; }
.editing { font-size: 13px; color: var(--accent); font-weight: 600; }

/* 학생 칸 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.tile {
  position: relative; border: 1px solid var(--line); background: var(--surface);
  border-radius: 12px; min-height: 78px; padding: 22px 6px 10px;
  display: flex; align-items: center; justify-content: center; text-align: center;
  font-size: 18px; font-weight: 600; line-height: 1.2; word-break: keep-all;
  transition: background .12s, border-color .12s;
  touch-action: manipulation; user-select: none;
}
.tile .no { position: absolute; top: 6px; left: 9px; font-size: 13px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.tile .mark { position: absolute; top: 6px; right: 8px; font-size: 12px; font-weight: 700; color: var(--absent-ink); }
.tile.absent { background: var(--absent-bg); border-color: var(--absent); color: var(--absent-ink); }
.tile.absent .name { text-decoration: line-through; text-decoration-thickness: 2px; }

/* 메모 */
.memo-field { display: flex; flex-direction: column; gap: 6px; }
.memo-field textarea {
  border: 1px solid var(--line); background: var(--surface); border-radius: 12px;
  padding: 10px 12px; min-height: 84px; resize: vertical; line-height: 1.5;
}

/* 아래 고정 막대 */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.dock .wrap { display: flex; gap: 8px; padding-block: 10px; }
.dock .btn { flex: 1; min-height: 54px; font-size: 16px; }

/* 기록 목록 */
.records { display: flex; flex-direction: column; gap: 8px; }
.rec {
  border: 1px solid var(--line); background: var(--surface); border-radius: var(--r);
  padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px;
}
.rec .when { font-weight: 600; font-variant-numeric: tabular-nums; }
.rec .abs { font-size: 14px; color: var(--muted); }
.rec .abs b { color: var(--absent-ink); font-weight: 600; }
.rec .memo { grid-column: 1 / -1; font-size: 14px; white-space: pre-wrap; }
.rec .acts { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 4px; }
.rec .acts .btn { min-height: 40px; padding: 0 12px; font-size: 14px; }

/* 시트(모달) */
.scrim {
  position: fixed; inset: 0; z-index: 20; background: rgba(10,16,24,.45);
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  background: var(--surface); width: 100%; max-width: 560px; max-height: 88dvh; overflow: auto;
  border-radius: 20px 20px 0 0; padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
@media (min-width: 640px) { .scrim { align-items: center; } .sheet { border-radius: 20px; } }
.sheet h2 { font: 24px/1.25 var(--display); margin: 0; text-wrap: balance; }
.sheet p { margin: 0; color: var(--muted); }
.sheet .acts { display: flex; flex-direction: column; gap: 8px; }
.imp {
  border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px;
}
.imp .row { display: flex; gap: 8px; align-items: center; }
.imp input[type=text] { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; min-height: 44px; padding: 0 10px; font-weight: 600; }
.imp input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); }
.imp .names { font-size: 13px; color: var(--muted); }
.imp .warn { font-size: 13px; color: var(--accent); }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 30;
  bottom: calc(86px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 16px;
  font-size: 14px; max-width: calc(100% - 32px); box-shadow: var(--shadow);
  pointer-events: none;
}
/* 음성 출석 */
.roll {
  position: fixed; inset: 0; z-index: 15; background: var(--bg);
  display: flex; flex-direction: column; gap: 12px;
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  max-width: 720px; margin: 0 auto;
}
.roll-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.roll-top .prog { font: 22px/1 var(--display); font-variant-numeric: tabular-nums; color: var(--muted); }
.roll-who { text-align: center; display: flex; flex-direction: column; gap: 2px; padding-block: 4px; }
.roll-who .no { font: 26px/1 var(--display); color: var(--muted); font-variant-numeric: tabular-nums; }
.roll-who .nm { font: clamp(44px, 14vw, 72px)/1.1 var(--display); word-break: keep-all; }
.roll-toggle {
  flex: none; min-height: 84px; border-radius: 18px; border: 2px solid var(--line);
  background: var(--surface); color: var(--ink);
  display: flex; align-items: center; justify-content: center; gap: 12px;
  font: 34px/1 var(--display); touch-action: manipulation;
}
.roll-toggle small { font: 500 14px/1.3 var(--body); color: var(--muted); }
.roll-toggle.absent { background: var(--absent); border-color: var(--absent); color: #fff; }
.roll-toggle.absent small { color: rgba(255,255,255,.85); }
.roll .btn { flex-direction: column; gap: 4px; border-radius: 22px; touch-action: manipulation; }
.roll .btn small { font: 500 15px/1.2 var(--body); opacity: .8; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.roll-next { flex: 1.5 1 0; min-height: 150px; font: 46px/1 var(--display); }
.roll-again { flex: 1 1 0; min-height: 110px; font: 34px/1 var(--display); border-width: 2px; }
.roll-prev { flex: none; min-height: 60px; font-size: 18px; }
.roll-prev small { font-size: 13px; }
.roll-set { min-height: 52px !important; font-size: 15px !important; border-radius: 14px !important; font-weight: 500; }
.set { display: flex; flex-direction: column; gap: 8px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.set select { flex: 1; min-width: 0; min-height: 44px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 10px; padding: 0 8px; }
.set input[type=range] { width: 100%; accent-color: var(--accent); height: 32px; }
.note { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; font-size: 14px; display: flex; flex-direction: column; gap: 6px; }
.note p { margin: 0; color: var(--ink); }
.note ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.drive-status { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.drive-status .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
.drive-status.ok .dot { background: #3E8E5A; }
.drive-status.wait .dot { background: #D89A2B; }
.sync-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.sync-line .btn { min-height: 36px; padding: 0 12px; font-size: 13px; }
.sheet a.btn { text-decoration: none; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--bg); border-radius: 12px; padding: 4px; }
.seg button { border: 0; background: transparent; border-radius: 9px; min-height: 48px; font-weight: 600; font-size: 16px; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.roll-start { flex: 1; display: flex; flex-direction: column; gap: 16px; justify-content: center; text-align: center; }
.roll-start h2 { font: 30px/1.25 var(--display); margin: 0; text-wrap: balance; }
.roll-start p { margin: 0; color: var(--muted); }
.roll-start .vol { background: var(--accent-soft); border-radius: var(--r); padding: 14px; color: var(--ink); font-weight: 500; }
.roll-start .btn { min-height: 120px; font-size: 26px; border-radius: 24px; }
.roll-opt { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--muted); }
.roll-opt input { width: 22px; height: 22px; accent-color: var(--accent); }
.roll-done { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
"use strict";

/* ---------- 저장소 ---------- */
const KEY = "attendance-book.v1";
let db = load();
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && Array.isArray(d.classes)) return { classes: d.classes, sessions: d.sessions || [] };
  } catch (e) {}
  return { classes: [], sessions: [] };
}
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); onDataChanged(); return true; }
  catch (e) { toast("기기에 저장하지 못했어요. 휴대폰 저장 공간을 확인해 주세요."); return false; }
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

/* ---------- 도우미 ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, "0");
function nowDT() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
const WD = "일월화수목금토";
function prettyDT(dt, withTime = true) {
  const [d, t] = dt.split(" ");
  const [y, m, dd] = d.split("-").map(Number);
  const w = WD[new Date(y, m - 1, dd).getDay()];
  return `${m}월 ${dd}일 (${w})` + (withTime && t ? ` ${t}` : "");
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const byNo = (a, b) => (a.no ?? 9999) - (b.no ?? 9999) || a.name.localeCompare(b.name, "ko");
const getClass = id => db.classes.find(c => c.id === id);
const classSessions = id => db.sessions.filter(s => s.classId === id).sort((a, b) => a.dt.localeCompare(b.dt));
// 그 수업 시각에 명단에 있던 학생
const activeAt = (cls, dt) => cls.students
  .filter(s => (!s.addedAt || s.addedAt <= dt) && (!s.leftAt || s.leftAt > dt))
  .sort(byNo);
function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

const ICON = {
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  chev: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>',
  upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 18v-6"/><path d="M9 15l3-3 3 3"/></svg>',
  list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',

let toastTimer;
function toast(msg) {

  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 2600);
}
function sheet(html, mount) {
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  scrim.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(scrim);
  const close = () => scrim.remove();
  scrim.addEventListener("click", e => { if (e.target === scrim) close(); });
  mount && mount(scrim.querySelector(".sheet"), close);
  return close;
}
function ask({ title, body = "", actions }) {

  }</div>`, (el, close) => {
    el.querySelectorAll("[data-i]").forEach(b => b.onclick = () => { close(); const f = actions[+b.dataset.i].fn; f && f(); });

function openClass(id, sessionId) {

  S.draft = s ? { id: s.id, dt: s.dt, absent: new Set(s.absent), memo: s.memo || "" }
              : { id: null, dt: nowDT(), absent: new Set(), memo: "" };
  S.classId = id; S.view = "class"; S.dirty = false;
  history.pushState({ v: "class" }, "");
  render();
}

function prevMemo(cls) {
  const d = S.draft;
  return classSessions(cls.id)
    .filter(s => s.id !== d.id && (s.memo || "").trim() && (!d.id || s.dt < d.dt))
    .pop();
}

const tallyHTML = (n, a) => `<span>재적 ${n}</span><span>출석 ${n - a}</span><span class="abs">결석 ${a}</span>`;

function saveSession() {
  const d = S.draft; const cls = getClass(S.classId);
  const ids = new Set(activeAt(cls, d.dt).map(s => s.id));
  const rec = { id: d.id || uid(), classId: cls.id, dt: d.dt, absent: [...d.absent].filter(id => ids.has(id)), memo: d.memo.trim() };
  const i = db.sessions.findIndex(s => s.id === rec.id);
  if (i >= 0) db.sessions[i] = rec; else db.sessions.push(rec);
  if (!persist()) return false;
  const wasNew = !d.id;

  toast(`${prettyDT(rec.dt)} 출석을 저장했어요 (결석 ${rec.absent.length}명)`);
  if (wasNew) renderClass();

  const go = () => { S.view = "home"; S.draft = null; after ? after() : render(); };

      actions: [
        { label: "저장하고 나가기", cls: "primary", fn: () => { if (saveSession()) go(); } },
        { label: "저장하지 않고 나가기", cls: "danger", fn: go },

  } else go();
}

/* ---------- 음성 출석 ---------- */
let R = null; // { list, i, el, lock }
const prefs = (() => { try { return JSON.parse(localStorage.getItem(KEY + ".prefs")) || {}; } catch (e) { return {}; } })();
if (prefs.sayNo === undefined) prefs.sayNo = true;
function savePrefs() { try { localStorage.setItem(KEY + ".prefs", JSON.stringify(prefs)); } catch (e) {} }

if (prefs.gender === undefined) prefs.gender = "female";
if (prefs.rate === undefined) prefs.rate = 0.9;

// 목소리 이름으로 성별 짐작 (기기마다 이름이 달라 모를 수도 있음)
const FEMALE = /female|woman|여성|여자|yuna|heami|sunhi|jimin|seoyeon|x-ism|x-kob/i;
const MALE = /\bmale\b|man\b|남성|남자|injoon|hyunsu|bongjin|gookmin|x-koc|x-kod/i;
const genderOf = v => FEMALE.test(v.name + " " + v.voiceURI) ? "female" : MALE.test(v.name + " " + v.voiceURI) ? "male" : null;
let koVoices = [];
function loadVoices() { try { koVoices = speechSynthesis.getVoices().filter(x => /^ko/i.test(x.lang)); } catch (e) {} }
if ("speechSynthesis" in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function chooseVoice() {
  if (!koVoices.length) loadVoices();
  const picked = prefs.voiceURI && koVoices.find(v => v.voiceURI === prefs.voiceURI);
  if (picked) return picked;
  return koVoices.find(v => genderOf(v) === prefs.gender && v.localService)
      || koVoices.find(v => genderOf(v) === prefs.gender)
      || koVoices.find(v => v.localService) || koVoices[0] || null;
}
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text), v = chooseVoice();
    u.lang = "ko-KR"; if (v) u.voice = v;
    // 고른 성별의 목소리가 기기에 없으면 높낮이로 맞춤
    u.pitch = v && genderOf(v) === prefs.gender ? 1 : (prefs.gender === "male" ? 0.65 : 1.15);
    u.volume = 1; u.rate = prefs.rate;
    speechSynthesis.speak(u);
  } catch (e) {}
}
const rateLabel = r => (r < 0.85 ? "느리게" : r > 1.05 ? "빠르게" : "보통") + ` · ${r.toFixed(1)}배`;

/* ---------- 엑셀 명단 읽기 ---------- */
const norm = s => String(s ?? "").replace(/\s+/g, "").trim();
const NAME_H = /^(이름|성명|학생명|학생이름|학생성명)$/;
const NO_H = /^(번호|번|출석번호|no\.?)$/i;
const CLS_H = /^(반|학급|분반|학반|반명|수업반)$/;
const ID_H = /^학번$/;
function parseRows(rows) {
  let h = -1, nameC = -1, noC = -1, clsC = -1, idC = -1;
  for (let i = 0; i < Math.min(rows.length, 15); i++) {
    const r = (rows[i] || []).map(norm);
    const n = r.findIndex(c => NAME_H.test(c));
    if (n >= 0) {
      h = i; nameC = n;
      noC = r.findIndex(c => NO_H.test(c));
      clsC = r.findIndex(c => CLS_H.test(c));
      idC = r.findIndex(c => ID_H.test(c));
      break;
    }
  }
  const groups = new Map();
  const add = (k, s) => { if (!groups.has(k)) groups.set(k, []); groups.get(k).push(s); };
  if (h >= 0) {
    for (let i = h + 1; i < rows.length; i++) {
      const r = rows[i] || [];
      const name = String(r[nameC] ?? "").trim();
      if (!name || NAME_H.test(norm(name))) continue;
      let no = noC >= 0 ? parseInt(String(r[noC]).replace(/\D/g, ""), 10) : NaN;
      if (isNaN(no) && idC >= 0) { const dg = String(r[idC]).replace(/\D/g, ""); if (dg.length >= 3) no = parseInt(dg.slice(-2), 10); }
      add(clsC >= 0 ? String(r[clsC] ?? "").trim() : "", { no: isNaN(no) ? null : no, name });
    }
  } else {
    // 제목 줄이 없을 때: "숫자 + 한글 이름" 줄을 찾음
    for (const r of rows) {
      const cells = (r || []).map(c => String(c ?? "").trim());
      const ni = cells.findIndex(c => /^[가-힣]{2,5}$/.test(c));
      if (ni < 1) continue;
      let no = null;
      for (let j = ni - 1; j >= 0; j--) {
        if (/^\d{1,5}$/.test(cells[j])) { const dg = cells[j]; no = parseInt(dg.length >= 3 ? dg.slice(-2) : dg, 10); break; }
      }
      if (no !== null) add("", { no, name: cells[ni] });
    }
  }
  for (const list of groups.values()) {
    let k = 0;
    list.forEach(s => { if (s.no == null) s.no = ++k; else k = Math.max(k, s.no); });
  }
  return groups;
}
function parseWorkbook(wb, fileName) {
  const base = fileName.replace(/\.[^.]+$/, "");
  const multi = wb.SheetNames.length > 1;
  const out = new Map();
  for (const sn of wb.SheetNames) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, defval: "", raw: false });
    const groups = parseRows(rows);
    const plain = /^(sheet|시트)\s*\d*$/i.test(sn.trim());
    const def = (multi || !plain) ? sn.trim() : base;
    for (const [k, list] of groups) {
      if (!list.length) continue;
      const name = k ? (/^\d+$/.test(k) ? k + "반" : k) : def;
      if (!out.has(name)) out.set(name, []);
      out.get(name).push(...list);
    }
  }
  return [...out].map(([name, students]) => ({ name, students: students.sort(byNo) }));
}

async function handleFile(file) { return handleBuffer(await file.arrayBuffer(), file.name); }
function fileKind(buf) {
  const h = new Uint8Array(buf.slice(0, 8));
  if (h[0] === 0xFF && h[1] === 0xD8) return "image";
  if (h[0] === 0x89 && h[1] === 0x50) return "image";
  if (h[0] === 0x52 && h[1] === 0x49 && h[2] === 0x46) return "image"; // webp
  if (h[0] === 0x25 && h[1] === 0x50 && h[2] === 0x44 && h[3] === 0x46) return "pdf";
  return "sheet";
}
function handleBuffer(buf, fileName) {
  if (!window.XLSX) { toast("엑셀 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요."); return; }
  const kind = fileKind(buf);
  if (kind === "image") return ask({ title: "사진은 아직 읽을 수 없어요", body: "명단 사진 인식은 다음 단계에서 넣을 예정이에요. 지금은 엑셀 파일(.xlsx)을 골라 주세요.", actions: [{ label: "확인", cls: "primary" }] });
  if (kind === "pdf") return ask({ title: "엑셀이 아니라 PDF로 받아졌어요", body: "구글 시트 파일을 휴대폰 파일 선택 창에서 고르면 PDF로 넘어올 수 있어요. 구글 시트에서 <b>파일 → 다운로드 → Microsoft Excel(.xlsx)</b>로 받은 뒤, 그 파일을 골라 주세요.", actions: [{ label: "확인", cls: "primary" }] });
  let groups;
  try {
    const wb = XLSX.read(buf, { type: "array" });
    groups = parseWorkbook(wb, fileName);
  } catch (e) {
    ask({ title: "파일을 열지 못했어요", body: "엑셀(.xlsx, .xls) 또는 CSV 파일인지 확인해 주세요.", actions: [{ label: "확인", cls: "primary" }] });
    return;
  }
  if (!groups.length) {
    let peek = "";
    try {
      const wb = XLSX.read(buf, { type: "array" });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "", raw: false }).slice(0, 3);
      peek = rows.map(r => r.slice(0, 4).map(c => esc(String(c).slice(0, 12))).join(" | ")).filter(Boolean).join("<br>");

    return;
  }
  showImportPreview(groups);
}

function applyImport(name, list) {
  const cls = db.classes.find(c => c.name === name);
  if (!cls) {
    db.classes.push({ id: uid(), name, createdAt: nowDT(),
      students: list.map(s => ({ id: uid(), no: s.no, name: s.name, addedAt: null, leftAt: null })) });
    return;
  }
  // 같은 반이면 이름으로 맞춰 기존 기록을 유지
  const now = nowDT(), used = new Set();
  const next = list.map(s => {
    const ex = cls.students.find(x => x.name === s.name && !used.has(x.id));
    if (ex) { used.add(ex.id); ex.no = s.no; ex.leftAt = null; return ex; }
    return { id: uid(), no: s.no, name: s.name, addedAt: now, leftAt: null };
  });
  cls.students.forEach(s => { if (!used.has(s.id)) { if (!s.leftAt) s.leftAt = now; next.push(s); } });
  cls.students = next;
}

/* ---------- 엑셀 내보내기 ---------- */
function sheetName(name, used) {
  let base = name.replace(/[\[\]:*?\/\\]/g, " ").trim().slice(0, 28) || "반";
  let n = base, k = 2;
  while (used.has(n)) n = `${base} ${k++}`;
  used.add(n); return n;
}
function buildWorkbook(classes) {
  const wb = XLSX.utils.book_new();
  const used = new Set(["진도 기록"]);
  const stamp = nowDT();
  const prog = [["반", "수업 일시", "재적", "출석", "결석", "결석 학생", "진도 메모"]];
  for (const cls of classes) {
    const ses = classSessions(cls.id);
    const studs = [...cls.students].sort(byNo);
    const aoa = [
      [`${cls.name} 출석부`],
      [`내보낸 시각 ${stamp}  ·  출 = 출석, 결 = 결석, - = 그때 명단에 없음`],
      [],
      ["번호", "이름", ...ses.map(s => s.dt), "출석 수", "결석 수"]
    ];
    for (const st of studs) {
      let p = 0, a = 0;
      const cells = ses.map(s => {
        if ((st.addedAt && st.addedAt > s.dt) || (st.leftAt && st.leftAt <= s.dt)) return "-";
        if (s.absent.includes(st.id)) { a++; return "결"; }
        p++; return "출";
      });
      aoa.push([st.no, st.name + (st.leftAt ? " (명단 제외)" : ""), ...cells, p, a]);
    }
    aoa.push(["", "결석 인원", ...ses.map(s => s.absent.length), "", ""]);
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws["!cols"] = [{ wch: 6 }, { wch: 14 }, ...ses.map(() => ({ wch: 17 })), { wch: 8 }, { wch: 8 }];
    XLSX.utils.book_append_sheet(wb, ws, sheetName(cls.name, used));
    for (const s of ses) {
      const n = activeAt(cls, s.dt).length;
      const names = s.absent.map(id => (cls.students.find(x => x.id === id) || {}).name).filter(Boolean).join(", ");
      prog.push([cls.name, s.dt, n, n - s.absent.length, s.absent.length, names, s.memo || ""]);
    }
  }
  const pws = XLSX.utils.aoa_to_sheet(prog);
  pws["!cols"] = [{ wch: 14 }, { wch: 17 }, { wch: 6 }, { wch: 6 }, { wch: 6 }, { wch: 24 }, { wch: 50 }];
  XLSX.utils.book_append_sheet(wb, pws, "진도 기록");
  return wb;
}
function exportFile(classes) {
  const d = nowDT().slice(0, 10);
  const label = classes.length === 1 ? classes[0].name : "전체";
  const fname = `출석부_${label}_${d}.xlsx`.replace(/[\\/:*?"<>|]/g, "_");
  const data = XLSX.write(buildWorkbook(classes), { bookType: "xlsx", type: "array" });

}
// 안드로이드 크롬·삼성 인터넷은 공유 메뉴로 .xlsx를 보낼 수 없어서(허용 형식 제한) CSV로 보냄
function csvFiles(classes) {
  const d = nowDT().slice(0, 10);
  return classes.map(cls => {
    const wb = buildWorkbook([cls]);
    const main = XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]]);
    const prog = XLSX.utils.sheet_to_csv(wb.Sheets["진도 기록"]);
    const text = "\uFEFF" + main + "\n\n진도 기록\n" + prog;
    const fname = `출석부_${cls.name}_${d}.csv`.replace(/[\\/:*?"<>|]/g, "_");
    return new File([text], fname, { type: "text/csv" });
  });
}

  const t = await getToken(interactive);
  const r = await fetch(url, Object.assign({}, opts, { headers: Object.assign({}, (opts || {}).headers, { Authorization: "Bearer " + t }) }));
  if (r.status === 401) { tok = null; try { sessionStorage.removeItem(KEY + ".tok"); } catch (e) {} throw new Error("expired"); }
  if (!r.ok) throw new Error("http_" + r.status);
  return r;
}
const gjson = async (url, opts, i) => (await gfetch(url, opts, i)).json();
const isAuthErr = e => /needs_click|expired|gis_not_loaded|popup|access_denied/.test(e.message);
const q = s => encodeURIComponent(s);

async function aliveId(id, i) {
  if (!id) return null;
  try { const j = await gjson(`${API}/${id}?fields=id,trashed`, {}, i); return j.trashed ? null : j.id; }
  catch (e) { if (isAuthErr(e)) throw e; return null; }
}
async function ensureFolder(i) {
  let id = await aliveId(dprefs.folderId, i);
  if (!id) {
    const l = await gjson(`${API}?q=${q(`name='${FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`)}&fields=files(id)`, {}, i);
    id = l.files[0] ? l.files[0].id : (await gjson(`${API}?fields=id`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: FOLDER_NAME, mimeType: "application/vnd.google-apps.folder" })
    }, i)).id;
  }
  dprefs.folderId = id; savePrefs(); return id;
}
async function findInFolder(name, i) {
  const folder = await ensureFolder(i);
  const l = await gjson(`${API}?q=${q(`name='${name}' and '${folder}' in parents and trashed=false`)}&orderBy=modifiedTime desc&fields=files(id,modifiedTime)`, {}, i);
  return l.files[0] || null;
}
async function upsert(name, mime, blob, idKey, i) {
  const folder = await ensureFolder(i);
  let id = await aliveId(dprefs[idKey], i);
  if (!id) { const f = await findInFolder(name, i); id = f && f.id; }
  const fd = new FormData();
  fd.append("metadata", new Blob([JSON.stringify(id ? { name } : { name, parents: [folder], mimeType: mime })], { type: "application/json" }));
  fd.append("file", blob);
  const j = await gjson(id ? `${UP}/${id}?uploadType=multipart&fields=id` : `${UP}?uploadType=multipart&fields=id`, { method: id ? "PATCH" : "POST", body: fd }, i);
  dprefs[idKey] = j.id; savePrefs(); return j.id;
}

let syncing = null;
function syncDrive(interactive) {
  if (!driveConfigured() || !dprefs.connected) return Promise.resolve(false);
  if (syncing) return syncing;
  syncing = (async () => {
    try {
      const backup = { app: "attendance-book", version: 1, savedAt: nowDT(), data: db };
      await upsert(BACKUP_NAME, "application/json", new Blob([JSON.stringify(backup)], { type: "application/json" }), "backupId", interactive);
      if (window.XLSX && db.classes.length) await upsert(XLSX_NAME, XLSX_MIME, exportFile(db.classes).blob, "xlsxId", interactive);
      dprefs.lastSync = nowDT(); dprefs.pending = false; dprefs.lastError = ""; savePrefs();
      return true;
    } catch (e) {
      dprefs.pending = true; dprefs.lastError = isAuthErr(e) ? "auth" : "net"; savePrefs();
      return false;
    } finally { syncing = null; updateSyncLine(); }
  })();
  updateSyncLine();
  return syncing;
}
// 기록이 바뀌면 바로 백업 (저장 버튼을 누른 직후라 구글 확인 창도 띄울 수 있음)
let restoring = false;
function onDataChanged() {
  if (restoring || !driveConfigured() || !dprefs.connected) return;
  dprefs.pending = true; savePrefs(); syncDrive(true);
}
function updateSyncLine() {
  const el = document.getElementById("sync-line");
  if (!el) return;
  if (!driveConfigured() || !dprefs.connected) { el.innerHTML = ""; return; }
  if (syncing) { el.innerHTML = `<span>드라이브에 백업하는 중…</span>`; return; }
  if (dprefs.pending) {
    el.innerHTML = `<span>${dprefs.lastError === "net" ? "인터넷이 연결되면 백업할게요" : "드라이브 백업을 기다리는 중이에요"}</span><button class="btn" data-act="sync-now">지금 백업</button>`;
    return;
  }
  el.innerHTML = dprefs.lastSync ? `<span>드라이브 백업 · ${prettyDT(dprefs.lastSync)}</span>` : "";
}
function driveError(e) {
  if (e.message === "gis_not_loaded") toast("구글 로그인 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.");
  else if (/popup|access_denied/.test(e.message)) toast("구글 계정 확인이 취소됐어요. 다시 눌러 주세요.");
  else toast("드라이브에 연결하지 못했어요. 잠시 뒤 다시 해 주세요.");
}

async function connectDrive() {
  try {
    await getToken(true);
    dprefs.connected = true; savePrefs();
    await ensureFolder(true);
    const b = await findInFolder(BACKUP_NAME, true);
    if (b && !db.classes.length) {
      toast("드라이브에서 지난 백업을 찾았어요");
      return restoreDrive();
    }
    const ok = await syncDrive(true);
    toast(ok ? "구글 드라이브에 연결하고 백업했어요" : "연결했지만 백업하지 못했어요. 다시 해 주세요.");
    render();
  } catch (e) { driveError(e); }
}
function disconnectDrive() {
  try { if (tok && window.google) google.accounts.oauth2.revoke(tok.access_token, () => {}); } catch (e) {}
  tok = null; try { sessionStorage.removeItem(KEY + ".tok"); } catch (e) {}
  Object.keys(dprefs).forEach(k => delete dprefs[k]); savePrefs();
  render(); toast("구글 드라이브 연결을 끊었어요. 드라이브에 있는 파일은 그대로 있어요.");
}
async function restoreDrive() {
  let backup;
  try {
    const f = await findInFolder(BACKUP_NAME, true);
    if (!f) { toast("드라이브에 백업 파일이 아직 없어요"); return; }
    backup = await gjson(`${API}/${f.id}?alt=media`, {}, true);
    dprefs.backupId = f.id; savePrefs();
  } catch (e) { return driveError(e); }
  if (!backup || backup.app !== "attendance-book" || !backup.data || !Array.isArray(backup.data.classes)) {
    toast("백업 파일 형식이 맞지 않아요"); return;
  }
  const d = backup.data;
  ask({
    title: "백업을 불러올까요?",
    body: `${prettyDT(backup.savedAt)} 백업 · ${d.classes.length}개 반, 수업 기록 ${(d.sessions || []).length}회<br>지금 이 폰에 있는 기록은 백업 내용으로 바뀌어요.`,
    actions: [
      { label: "불러오기", cls: "primary", fn: () => {
        db = { classes: d.classes, sessions: d.sessions || [] };
        restoring = true; persist(); restoring = false;
        dprefs.pending = false; dprefs.lastSync = backup.savedAt; savePrefs();
        S.view = "home"; render(); toast("백업을 불러왔어요");
      } },
      { label: "취소" }
    ]
  });
}
async function driveExportNow() {
  if (!dprefs.connected) return openDriveSettings();
  const ok = await syncDrive(true);
  if (ok) toast(`드라이브 '${FOLDER_NAME}' 폴더에 ${XLSX_NAME}로 저장했어요`);
  else toast("드라이브에 저장하지 못했어요. 인터넷 연결을 확인해 주세요.");
}

// 드라이브에서 명단 엑셀 고르기 (Google Picker)
function loadPicker() {
  return new Promise((res, rej) => {
    if (window.google && google.picker) return res();
    if (!window.gapi) return rej(new Error("gis_not_loaded"));
    gapi.load("picker", { callback: res, onerror: () => rej(new Error("gis_not_loaded")) });
  });
}
async function pickFromDrive() {
  let t;
  try { t = await getToken(true); await loadPicker(); }
  catch (e) { return driveError(e); }
  if (!dprefs.connected) { dprefs.connected = true; savePrefs(); }
  const view = new google.picker.DocsView(google.picker.ViewId.DOCS)
    .setMimeTypes([XLSX_MIME, "application/vnd.ms-excel", "text/csv", "application/vnd.google-apps.spreadsheet"].join(","))
    .setMode(google.picker.DocsViewMode.LIST);
  new google.picker.PickerBuilder()
    .addView(view).setOAuthToken(t).setDeveloperKey(DRIVE.apiKey).setAppId(DRIVE.appId)
    .setLocale("ko").setTitle("명단 엑셀 고르기")
    .setCallback(async data => {
      if (data.action !== google.picker.Action.PICKED) return;
      const f = data.docs[0];
      try {
        toast("파일을 불러오는 중이에요");
        const url = f.mimeType === "application/vnd.google-apps.spreadsheet"
          ? `${API}/${f.id}/export?mimeType=${q(XLSX_MIME)}` : `${API}/${f.id}?alt=media`;
        const buf = await (await gfetch(url, {}, true)).arrayBuffer();
        handleBuffer(buf, f.name);
      } catch (e) { driveError(e); }
    })
    .build().setVisible(true);
}

function openImportChoice() {
  if (!driveConfigured() || !DRIVE.apiKey) return document.getElementById("file").click();
  sheet(`<h2>명단 올리기</h2>
    <p>첫 줄에 번호, 이름 제목이 있는 엑셀이나 구글 시트를 골라 주세요.</p>
    <div class="acts">
      <button class="btn primary block" id="im-drive">${ICON.drive}구글 드라이브에서 고르기</button>
      <button class="btn block" id="im-file">${ICON.upload}이 폰에 있는 파일에서 고르기</button>
      <button class="btn block" id="im-cancel">취소</button>
    </div>`, (el, close) => {
    el.querySelector("#im-drive").onclick = () => { close(); pickFromDrive(); };
    el.querySelector("#im-file").onclick = () => { close(); document.getElementById("file").click(); };
    el.querySelector("#im-cancel").onclick = close;
  });
}

function openSettings() {
  sheet(`<h2>설정</h2>
    <div class="acts">
      <button class="btn block" id="st-voice">${ICON.voice}음성 설정</button>
      <button class="btn block" id="st-drive">${ICON.drive}구글 드라이브 백업</button>
      <button class="btn block" id="st-close">닫기</button>
    </div>`, (el, close) => {
    el.querySelector("#st-voice").onclick = () => { close(); openVoiceSettings(); };
    el.querySelector("#st-drive").onclick = () => { close(); openDriveSettings(); };
    el.querySelector("#st-close").onclick = close;
  });
}
function openDriveSettings() {
  if (!driveConfigured()) {
    return ask({ title: "구글 드라이브 연결 준비 중", body: "앱에 구글 연결 정보가 아직 들어가지 않았어요. 준비가 끝나면 이 화면에서 연결할 수 있어요.", actions: [{ label: "확인", cls: "primary" }] });
  }
  const c = dprefs.connected;
  const state = !c ? "" : dprefs.pending ? "wait" : "ok";
  const msg = !c ? "아직 연결하지 않았어요"
    : syncing ? "백업하는 중이에요"
    : dprefs.pending ? "백업을 기다리는 중이에요"
    : dprefs.lastSync ? `마지막 백업 ${prettyDT(dprefs.lastSync)}` : "연결됨";
  sheet(`<h2>구글 드라이브 백업</h2>
    <div class="drive-status ${state}"><span class="dot"></span><span>${msg}</span></div>
    <p>출석을 저장할 때마다 내 드라이브의 <b>'${FOLDER_NAME}'</b> 폴더에 백업 파일과 출석부 엑셀(${XLSX_NAME})을 자동으로 저장해요. 이 앱이 만든 파일만 다루고, 드라이브의 다른 파일은 보지 않아요.</p>
    <div class="acts">
      ${c ? `
        <button class="btn primary block" id="dv-sync">지금 백업하기</button>
        <button class="btn block" id="dv-restore">백업에서 불러오기</button>
        ${dprefs.folderId ? `<a class="btn block" href="https://drive.google.com/drive/folders/${esc(dprefs.folderId)}" target="_blank" rel="noopener">드라이브 폴더 열기</a>` : ""}
        <button class="btn danger block" id="dv-off">연결 끊기</button>`
      : `<button class="btn primary block" id="dv-on">${ICON.drive}구글 계정 연결하기</button>`}
      <button class="btn block" id="dv-close">닫기</button>
    </div>`, (el, close) => {
    const on = (id, fn) => { const b = el.querySelector(id); if (b) b.onclick = fn; };
    on("#dv-on", () => { close(); connectDrive(); });
    on("#dv-sync", () => { close(); syncDrive(true).then(ok => toast(ok ? "드라이브에 백업했어요" : "백업하지 못했어요. 인터넷 연결을 확인해 주세요")); });
    on("#dv-restore", () => { close(); restoreDrive(); });
    on("#dv-off", () => { close(); ask({ title: "드라이브 연결을 끊을까요?", body: "자동 백업이 멈춰요. 드라이브에 저장된 파일은 지워지지 않아요.", actions: [{ label: "연결 끊기", cls: "solid-danger", fn: disconnectDrive }, { label: "취소" }] }); });
    on("#dv-close", close);
  });
}

/* ---------- 예시 반 ---------- */
function loadDemo() {
  const names = ["강민준","김서연","김하준","박지우","박도윤","이서윤","이시우","정하은","최지호","한수아","오예준","윤채원","임건우","장유나","조은우","황지민"];
  const cls = { id: uid(), name: "예시 2학년 3반", createdAt: nowDT(),
    students: names.map((n, i) => ({ id: uid(), no: i + 1, name: n, addedAt: null, leftAt: null })) };
  db.classes.push(cls);
  const day = k => { const d = new Date(); d.setDate(d.getDate() - k); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  db.sessions.push(
    { id: uid(), classId: cls.id, dt: `${day(7)} 10:10`, absent: [cls.students[3].id], memo: "1단원 매체의 개념 정리, 모둠별 사례 찾기" },
    { id: uid(), classId: cls.id, dt: `${day(2)} 13:20`, absent: [cls.students[5].id, cls.students[11].id], memo: "2단원 매체 언어의 특성 — 활동지 3번까지" }
  );
  persist(); render();
  toast("예시 반을 만들었어요. 다 보셨으면 기록 화면에서 지울 수 있어요");
}

/* ---------- 이벤트 ---------- */
app.addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.sid) return toggle(t.dataset.sid);
  if (t.dataset.open) return openClass(t.dataset.open);
  if (t.dataset.edit) { S.view = "class"; const s = db.sessions.find(x => x.id === t.dataset.edit);
    S.draft = { id: s.id, dt: s.dt, absent: new Set(s.absent), memo: s.memo || "" }; S.dirty = false; return render(); }
  if (t.dataset.del) {
    const s = db.sessions.find(x => x.id === t.dataset.del);
    return ask({ title: `${prettyDT(s.dt)} 기록을 지울까요?`, body: "지운 기록은 되돌릴 수 없어요.",
      actions: [{ label: "지우기", cls: "solid-danger", fn: () => { db.sessions = db.sessions.filter(x => x.id !== s.id); persist(); render(); toast("기록을 지웠어요"); } }, { label: "취소" }] });
  }
  const cls = getClass(S.classId);
  switch (t.dataset.act) {
    case "import": openImportChoice(); break;
    case "demo": loadDemo(); break;
    case "export": exportSheet(db.classes, "출석부 내보내기"); break;
    case "export-one": exportSheet([cls], `${cls.name} 내보내기`); break;
    case "save": saveSession(); break;
    case "roll": openRoll(); break;
    case "voice-set": openVoiceSettings(); break;
    case "settings": openSettings(); break;
    case "sync-now": syncDrive(true).then(ok => toast(ok ? "드라이브에 백업했어요" : "백업하지 못했어요. 인터넷 연결을 확인해 주세요")); break;
    case "back": history.back(); break;
    case "records":
      if (S.dirty || !S.draft.id) {
        ask({ title: "출석을 먼저 저장할까요?", body: "기록 화면으로 가면 지금 체크한 내용이 사라져요.",
          actions: [{ label: "저장하고 기록 보기", cls: "primary", fn: () => { if (saveSession()) { S.view = "records"; render(); } } },
                    { label: "저장하지 않고 기록 보기", cls: "danger", fn: () => { S.view = "records"; render(); } },
                    { label: "계속 체크하기" }] });
      } else { S.view = "records"; render(); }
      break;
    case "to-class": case "new-session":
      S.draft = { id: null, dt: nowDT(), absent: new Set(), memo: "" }; S.dirty = false; S.view = "class"; render(); break;
    case "del-class":
      ask({ title: `${cls.name}을(를) 지울까요?`, body: "학생 명단과 출결 기록이 모두 지워지고 되돌릴 수 없어요. 필요하면 먼저 내보내기로 엑셀을 받아 두세요.",
        actions: [{ label: "반 지우기", cls: "solid-danger", fn: () => {
          db.classes = db.classes.filter(c => c.id !== cls.id);
          db.sessions = db.sessions.filter(s => s.classId !== cls.id);
          persist(); S.view = "home"; S.classId = null; history.back(); render(); toast("반을 지웠어요"); } }, { label: "취소" }] });
      break;
  }
});

document.getElementById("file").addEventListener("change", e => {
  const f = e.target.files[0]; e.target.value = "";
  if (f) handleFile(f);
});

// 휴대폰 뒤로 가기
window.addEventListener("popstate", () => {
  if (R) return closeRoll();
  if (S.view === "home") return;
  if (S.view === "records") { S.view = "home"; S.draft = null; return render(); }
  leaveClass();
});
window.addEventListener("beforeunload", e => {
  if (S.view === "class" && S.dirty) { e.preventDefault(); e.returnValue = ""; }
});

// 테스트용으로 바깥에 노출
window.__att = { parseRows, parseWorkbook, buildWorkbook, get db() { return db; } };

render();
setTimeout(() => { if (dprefs.connected && dprefs.pending) syncDrive(false); }, 1500);
window.addEventListener("online", () => { if (dprefs.connected && dprefs.pending) syncDrive(false); });

if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
})();
