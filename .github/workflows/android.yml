name: 안드로이드 앱 빌드

# 깃허브 'Actions' 탭에서 직접 실행하거나, v로 시작하는 태그를 올리면 앱을 만들어 릴리스에 올림 (Obtainium이 여기서 받아 감)
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 웹앱 파일을 앱으로 복사
        run: |
          npm ci
          npm run sync

      - name: 서명 키 준비
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::깃허브 Secrets에 ANDROID_KEYSTORE_BASE64가 없어서, 빌드만 확인하고 릴리스는 올리지 않아요."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/attendance.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/attendance.keystore" >> "$GITHUB_ENV"
          echo "SIGNED=1" >> "$GITHUB_ENV"

      - name: 앱 빌드
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          ls app/build/outputs/apk/release/

      - name: 릴리스에 올리기
        if: env.SIGNED == '1'
        run: cp android/app/build/outputs/apk/release/app-release.apk "attendance-1.0.${{ github.run_number }}.apk"

      - if: env.SIGNED == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 출석부 1.0.${{ github.run_number }}
          files: attendance-1.0.${{ github.run_number }}.apk
          body: 수업 출석부 안드로이드 앱. Obtainium으로 설치·업데이트하세요.
